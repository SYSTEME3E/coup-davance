name: Application Android (APK)

# Fabrique l'APK signé et le dépose dans public/PronostBet.apk (téléchargeable depuis le site).
# Se lance uniquement à la main : onglet Actions > Application Android (APK) > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - name: Vérifier les secrets de signature
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Secrets manquants : ANDROID_KEYSTORE_BASE64 et ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Cache Gradle : évite de re-télécharger toutes les dépendances à chaque build
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Anti-429 : remplace Maven Central (limité sur les IP GitHub) par le miroir Google
      - name: Miroir Maven (anti erreur 429)
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/mirror.gradle" <<'GRADLE'
          def MIRROR = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def swap = { repos ->
            repos.configureEach { r ->
              if (r instanceof MavenArtifactRepository) {
                def u = r.url.toString()
                if (u.contains('repo.maven.apache.org') || u.contains('repo1.maven.org')) {
                  r.url = MIRROR
                }
              }
            }
          }
          gradle.settingsEvaluated { settings ->
            swap(settings.pluginManagement.repositories)
            try { swap(settings.dependencyResolutionManagement.repositories) } catch (ignored) {}
          }
          gradle.allprojects { prj ->
            swap(prj.buildscript.repositories)
            swap(prj.repositories)
          }
          GRADLE
          sed -i 's/^          //' "$HOME/.gradle/init.d/mirror.gradle"
          cat "$HOME/.gradle/init.d/mirror.gradle"

      - name: Préparer le SDK Android (déjà installé sur le serveur GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Installer Capacitor et créer le projet Android
        working-directory: android-app
        run: |
          npm install
          # Sans google-services.json, le plugin push fait PLANTER l'appli au lancement (Firebase non initialisé).
          # On ne l'inclut donc que si le secret est présent : sinon l'appli s'ouvre normalement, sans notifications.
          if [ -z "$GS_B64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 absent : plugin push retiré pour éviter le plantage."
            npm uninstall @capacitor/push-notifications
          fi
          npx cap add android

      - name: Notifications Android (Firebase)
        working-directory: android-app
        run: |
          if [ -n "$GS_B64" ]; then
            # Accepte du base64 (avec ou sans retours à la ligne) OU le JSON brut collé tel quel
            if printf '%s' "$GS_B64" | head -c 1 | grep -q '{'; then
              printf '%s' "$GS_B64" > android/app/google-services.json
            else
              printf '%s' "$GS_B64" | tr -d ' \r\n' | base64 -d > android/app/google-services.json 2>/dev/null || true
            fi
            python3 - <<'PY'
          import json,sys
          f="android/app/google-services.json"
          try:
              d=json.load(open(f,encoding="utf-8"))
          except Exception as e:
              print("::error::Le secret GOOGLE_SERVICES_JSON_BASE64 n'est pas un JSON/base64 valide. Recopie-le en entier (sans guillemets autour).")
              sys.exit(1)
          pk=[]
          for c in d.get("client",[]):
              n=(c.get("client_info",{}).get("android_client_info",{}) or {}).get("package_name")
              if n: pk.append(n)
          print("Projet Firebase :",d.get("project_info",{}).get("project_id"))
          print("Applis Android trouvees :",pk if pk else "AUCUNE")
          if "com.coupdavance.app" not in pk:
              print("::error::Ce google-services.json ne contient pas l'appli Android com.coupdavance.app (trouve : %s). Dans Firebase > Parametres du projet > Vos applis : ajoute une appli ANDROID avec ce package, puis retelecharge google-services.json." % (pk or "aucune appli Android - c'est probablement le fichier de l'appli web"))
              sys.exit(1)
          PY
            echo "google-services.json installé et vérifié."
          else
            echo "::warning::Secret GOOGLE_SERVICES_JSON_BASE64 absent : l'appli sera construite SANS notifications push."
          fi
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$M"
          grep -n "uses-permission" "$M"

      - name: Installer ImageMagick (pour les icônes)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Icônes et écran de démarrage
        working-directory: android-app
        run: bash scripts/prepare-assets.sh

      - name: Numéro de version
        working-directory: android-app
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Compiler (release)
        working-directory: android-app/android
        run: |
          # 3 tentatives : si le réseau/le dépôt répond mal (429, timeout), on réessaie
          for i in 1 2 3; do
            if ./gradlew assembleRelease --no-daemon --stacktrace \
                 -Dorg.gradle.internal.http.connectionTimeout=60000 \
                 -Dorg.gradle.internal.http.socketTimeout=60000 \
                 -Dorg.gradle.internal.repository.max.retries=6 \
                 -Dorg.gradle.internal.repository.initial.backoff=2000; then
              exit 0
            fi
            echo "::warning::Compilation échouée (tentative $i/3), nouvelle tentative dans $((i * 20))s..."
            sleep $((i * 20))
          done
          echo "::error::La compilation a échoué après 3 tentatives."
          exit 1

      - name: Aligner et signer
        working-directory: android-app/android
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias coupdavance --out "$GITHUB_WORKSPACE/PronostBet.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/PronostBet.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: PronostBet-apk
          path: PronostBet.apk

      - name: Publier l'APK sur le site (public/)
        run: |
          set -e
          cp PronostBet.apk "$RUNNER_TEMP/new.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            cp "$RUNNER_TEMP/new.apk" public/PronostBet.apk
            git add public/PronostBet.apk
            echo '{"build":${{ github.run_number }}}' > public/version.json
            git add public/version.json
            if git diff --cached --quiet; then
              echo "APK identique, rien à publier."
              exit 0
            fi
            git commit -m "Application Android : nouvelle version (build ${{ github.run_number }})"
            if git push origin main; then
              echo "APK publié (tentative $i)."
              exit 0
            fi
            echo "Push refusé (main a changé), nouvelle tentative..."
            sleep $((i * 5))
          done
          echo "::error::Impossible de publier l'APK après 5 tentatives."
          exit 1

      - name: Publier l'APK sur le site (public/)
        run: |
          cp coup-davance.apk "$RUNNER_TEMP/new.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/new.apk" public/coup-davance.apk
          git add public/coup-davance.apk
          git commit -m "Application Android : nouvelle version (build ${{ github.run_number }})" || exit 0
          git push origin HEAD:main

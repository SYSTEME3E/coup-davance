name: Application Android (APK)

# Fabrique l'APK signé et le dépose dans public/coup-davance.apk (téléchargeable depuis le site).
# Se lance uniquement à la main : onglet Actions > Application Android (APK) > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Vérifier les secrets de signature
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Secrets manquants : ANDROID_KEYSTORE_BASE64 et ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer le SDK Android (déjà installé sur le serveur GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Installer Capacitor et créer le projet Android
        working-directory: android-app
        run: |
          npm install
          npx cap add android

      - name: Installer ImageMagick (pour les icônes)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Icônes et écran de démarrage
        working-directory: android-app
        run: bash scripts/prepare-assets.sh

      - name: Numéro de version
        working-directory: android-app
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Compiler (release)
        working-directory: android-app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Aligner et signer
        working-directory: android-app/android
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias coupdavance --out "$GITHUB_WORKSPACE/coup-davance.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/coup-davance.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: coup-davance-apk
          path: coup-davance.apk

      - name: Publier l'APK sur le site (public/)
        run: |
          cp coup-davance.apk "$RUNNER_TEMP/new.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/new.apk" public/coup-davance.apk
          git add public/coup-davance.apk
          git commit -m "Application Android : nouvelle version (build ${{ github.run_number }})" || exit 0
          git push origin HEAD:main

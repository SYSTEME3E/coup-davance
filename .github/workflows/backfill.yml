name: Remonter l'historique des matchs
on:
  workflow_dispatch:
    inputs:
      days: { description: "Nombre de jours à remonter", default: "45" }
      dry: { description: "Essai sans écriture (true/false)", default: "true" }
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run backfill -- --days ${{ inputs.days }} ${{ inputs.dry == 'true' && '--dry' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

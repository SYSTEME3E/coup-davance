<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#130F33"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PronostBet"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Hanken+Grotesk:wght@400;500;700&display=swap"><link rel="stylesheet" href="style.css">
<style>
[hidden]{display:none!important}
.code{font:800 34px/1 "Bricolage Grotesque",sans-serif;letter-spacing:.14em;text-align:center;padding:18px 10px;margin:12px 0;background:var(--bg);border:1px dashed var(--brand);border-radius:12px;overflow-wrap:anywhere}
.code.blur{filter:blur(9px);user-select:none;pointer-events:none}
.lock{position:relative}
.lock .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;text-align:center;padding:0 12px}
.row2{display:flex;gap:8px;flex-wrap:wrap}.row2 .btn{flex:1;min-width:140px;width:auto}
.bal{font:800 46px/1.05 "Bricolage Grotesque",sans-serif;margin:6px 0 2px}
select,input.fld{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.ph{display:flex;gap:8px;align-items:center}.ph span{padding:12px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:700;white-space:nowrap}
.alln{background:none;border:0;padding:0;color:var(--brand);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
#wm{margin:0 0 8px;font-size:15px;font-weight:700}#wm.ok{color:#0B6B33}#wm.ko{color:#B42318}
.hr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.hr:first-of-type{border-top:0}.hr small{display:block;color:var(--muted);font-size:13px}
.hr b{white-space:nowrap}.hr .pos{color:#0B6B33}.hr .neg{color:#B42318}
.lk2{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font:700 13px "Hanken Grotesk",sans-serif;cursor:pointer;color:var(--ink);margin-top:6px}
/* Cartes de la page en blanc */
#app .sec{background:#fff;border-color:#E4E5EE;color:#1B1650;--ink:#1B1650;--muted:#6B6890;--line:#E4E5EE;--bg:#F1F2F7;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#app .sec h2{color:#1B1650}
#app .ref div{background:#F1EEFF;border-color:#D5CCFF}
#app .btn.ghost,#app .more{background:#fff;border:1.5px solid #6F5BFF;color:#5A47E0}
#app .btn.ghost:hover,#app .more:hover{background:#F1EEFF}
#app .btn.danger{background:#D93B3B;color:#fff}
#app .btn.danger:hover{background:#B42318}
</style><link rel="stylesheet" href="theme.css"><title>Mon solde – PronostBet</title></head><body><div class="wrap">
<header class="top"><a class="logo" href="index.html"><img src="icon.svg" alt="" width="34" height="34"><span>PronostBet</span></a></header>
<h1 class="pt">Parrainage et gains</h1><p class="sub" style="text-transform:none">Ton code, tes filleuls et tes gains.</p>
<div id="app"><p class="sub">Chargement…</p></div>
<div style="height:40px"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script src="config.js"></script><script src="i18n.js"></script><script>
const $=i=>document.getElementById(i),sb=supabase.createClient(CFG.url,CFG.key);
</script><script src="menu.js"></script><script>
const t=PB.t,F=PB.fmt;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=s=>s?new Date(s).toLocaleDateString(PB.loc(),{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
const ST={pending:["in","En attente"],processing:["in","En cours"],manual:["in","En traitement"],paid:["ok","Payé"],failed:["ko","Échoué"],canceled:["mu","Annulé"]};
const KD={referral_reward:"Parrainage",withdrawal:"Retrait",withdrawal_refund:"Retrait recrédité",adjustment:"Ajustement"};
const SHOW=4,STEP=10;
const moreBtn=(id,shown,total)=>shown<total?'<button type="button" class="more" id="'+id+'" style="display:block;width:100%;margin-top:10px">'+t("Voir plus")+'</button>':"";
let NETS=[],NMAP={},R=null,WD=[],TX=[],busy=false,RATE=0,swd=SHOW,stx=SHOW;
const say=(m,ok)=>{const e=$("wm");if(e){e.textContent=m?t(m):"";e.className=m?(ok?"ok":"ko"):""}};
async function api(path,body){const{data:{session}}=await sb.auth.getSession();if(!session)throw new Error("session");
  const fn={"/api/withdraw":"withdraw","/api/sync":"withdraw-sync"}[path];if(!fn)throw new Error("route");
  const r=await fetch(CFG.url+"/functions/v1/"+fn,{method:"POST",headers:{"Content-Type":"application/json",apikey:CFG.key,Authorization:"Bearer "+session.access_token},body:JSON.stringify(body||{})});
  return r.json().catch(()=>({ok:false}))}

async function load(){
  const[a,w,tx,fx]=await Promise.all([sb.rpc("my_referral"),
    sb.from("withdrawals").select("id").limit(1),
    sb.from("wallet_transactions").select("kind,amount,note,created_at").order("created_at",{ascending:false}).limit(60),
    sb.from("usd_rates").select("currency,per_usd")]);
  PB.setRates(fx&&fx.data);
  if(a.error){$("app").innerHTML='<div class="card">Impossible de charger tes gains pour le moment. Réessaie dans un instant.</div>';return false}
  R=a.data;TX=tx.data||[];return true}
function codeCard(){
  if(R.has_sub){const link=location.origin+"/auth.html?ref="+encodeURIComponent(R.code)+"#signup";
    return '<div class="sec"><h2>Ton code de parrainage</h2><div class="code" id="cd">'+esc(R.code)+'</div>'
      +'<div class="row2"><button class="btn" id="cp" type="button">Copier le lien</button><button class="btn ghost" id="sh" type="button">Partager</button></div>'
      +'<p class="note">Lien à envoyer : <span style="overflow-wrap:anywhere">'+esc(link)+'</span></p></div>'}
  return '<div class="sec"><h2>Ton code de parrainage</h2><div class="lock"><div class="code blur" aria-hidden="true">A7K9M2QX</div><div class="lk">🔒 Visible avec un VIP actif</div></div>'
    +'<p class="note">'+t("Active le VIP pour débloquer ton code et gagner {0} (Basic) ou {1} (Gold) par filleul.",F(500),F(1500))+'</p><a class="btn" href="abonnement.html" style="margin-top:12px">Voir les offres VIP</a></div>'}
function statCard(){return '<div class="sec"><h2>Mon solde</h2><div class="bal">'+F(R.balance)+'</div>'
  +'<div class="stats" style="margin-top:12px"><div><b>'+R.referred+'</b>filleuls inscrits</div><div><b>'+R.rewarded+'</b>filleuls VIP</div><div><b>'+F(R.earned)+'</b>gagnés au total</div></div>'
  +'<a class="btn danger" href="retrait.html" style="margin-top:14px">Retirer mes gains</a></div>'}
function refBox(){return '<div class="sec"><h2>Parraine et gagne</h2><p class="note" style="margin:0">Quand ton filleul active un plan, tu touches une récompense créditée automatiquement sur ton solde.</p><div class="ref"><div><b>'+F(500)+'</b><span>quand ton filleul active Basic</span></div><div><b>'+F(1500)+'</b><span>quand ton filleul active Gold</span></div></div><p class="note">Ton code de parrainage est disponible dès que ton VIP est actif. Les gains se retirent par Mobile Money, virement bancaire ou USDT (TRC20).</p></div>'}
function txCard(){
  const l=TX.slice(0,stx),body=l.length?l.map(x=>'<div class="hr"><div>'+esc(t(KD[x.kind]||x.kind))+'<small>'+dt(x.created_at)+'</small></div><b class="'+(x.amount>=0?"pos":"neg")+'">'+(x.amount>=0?"+":"−")+F(Math.abs(x.amount))+'</b></div>').join(""):'<p class="note">Aucun mouvement pour le moment.</p>';
  return '<div class="sec"><h2>Mouvements du solde</h2>'+body+moreBtn("mtx",stx,TX.length)+'</div>'}
function draw(){
  $("app").innerHTML=statCard()+refBox()+codeCard()+txCard();
  if($("cp")){const link=location.origin+"/auth.html?ref="+encodeURIComponent(R.code)+"#signup";
    $("cp").onclick=async()=>{try{await navigator.clipboard.writeText(link);$("cp").textContent=t("Lien copié ✓")}catch(e){prompt("Copie ce lien :",link)}};
    $("sh").onclick=()=>{const txt=(PB.lang()==="en"?"Join PronostBet with my code ":"Rejoins PronostBet avec mon code ")+R.code+" : "+link;
      if(navigator.share)navigator.share({title:"PronostBet",text:txt,url:link}).catch(()=>{});else open("https://wa.me/?text="+encodeURIComponent(txt),"_blank","noopener")}}
  if($("mtx"))$("mtx").onclick=()=>{stx+=STEP;draw()}}
document.addEventListener("pb-country",()=>{if(R)draw()});
(async()=>{const{data:{session}}=await sb.auth.getSession();if(!session)return location.href="auth.html#login";
  await PB.sync(sb);if(await load())draw()})();
</script><script src="pwa.js" defer></script></body></html>

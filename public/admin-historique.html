<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
.ctl{display:grid;gap:10px;margin:12px 0}.ctl label{display:flex;gap:10px;align-items:center;font-size:15px}.ctl input[type=number]{width:90px;font:inherit;padding:10px 12px;border:1px solid rgba(128,128,128,.35);border-radius:12px;background:transparent;color:inherit}
.ctl button{font:inherit;font-weight:700;border:1px solid rgba(128,128,128,.4);background:transparent;color:inherit;border-radius:12px;padding:12px 16px;min-height:46px;cursor:pointer}.ctl button:disabled{opacity:.5}
#log{font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap;margin:12px 0;max-height:48vh;overflow:auto;opacity:.9}
</style><link rel="stylesheet" href="theme.css"><title>Historique – Administration</title></head><body><div class="wrap">
<header class="top"><a class="logo" href="index.html"><img src="icons/icon-192.png" alt="" width="34" height="34"><span>PRONOST<b>BET</b></span></a></header>
<h1 class="pt">Historique des matchs</h1>
<p class="sub" style="text-transform:none">Récupère les résultats passés (petites ligues comprises) depuis SportScore, avec ton téléphone, et les ajoute à l’archive. Garde cet écran ouvert jusqu’à la fin. Tu peux relancer sans risque : les matchs déjà présents sont ignorés.</p>
<div class="ctl"><label>Nombre de jours à remonter <input id="days" type="number" min="1" max="120" value="45"></label>
<label><input id="dry" type="checkbox" checked style="width:20px;height:20px"> Essai : ne rien écrire</label>
<button id="go" type="button" class="more">Lancer</button><button id="stop" type="button" hidden>Arrêter</button></div>
<div id="msg" class="pfm" role="status"></div><div id="log" aria-live="polite"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script src="config.js"></script><script>
const $=i=>document.getElementById(i),sb=supabase.createClient(CFG.url,CFG.key);
</script><script src="admin-menu.js"></script><script>
(async()=>{
const{data:{session}}=await sb.auth.getSession();if(!session){location.replace("auth.html#login");return}
const{data:adm}=await sb.rpc("is_admin");if(!adm){location.replace("dashboard.html");return}
const L=t=>{const e=$("log");e.textContent+=t+"\n";e.scrollTop=e.scrollHeight},sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=(o,ks)=>{for(const k of ks){const v=k.split(".").reduce((a,x)=>a==null?a:a[x],o);if(v!=null&&v!=="")return v}return null};
const nm=t=>t==null?"":typeof t==="string"?t:(t.name||t.title||t.short_name||"");
function norm(m){
  const txt=(String(pick(m,["status","state"])||"")+" "+String(m.status_text||"")).toLowerCase();
  if(!/finish|ended|\bft\b|full[- ]?time|terminé|final/.test(txt)||/extra|\baet\b|penalt|\bpen\b/.test(txt))return null; // prolongations / tirs au but : ignorés
  const sc=k=>{const v=pick(m,[k+"_score",k+"Score","score."+k,"goals."+k]);return v&&typeof v==="object"?pick(v,["current","display","total","ft"]):v};
  const t=pick(m,["time","start_time","startTime","kickoff","date"]),d=new Date(typeof t==="number"&&t<1e12?t*1000:t);
  const home=nm(pick(m,["home_team","homeTeam","home","teams.home"])),away=nm(pick(m,["away_team","awayTeam","away","teams.away"])),league=nm(pick(m,["competition","league","tournament"]));
  if(!home||!away||!league||isNaN(+d))return null;
  return{home,away,league,kickoff:d.toISOString(),hs:String(sc("home")),as:String(sc("away"))}}
async function day(date){
  const q=new URLSearchParams({sport:"football",date,status:"finished",limit:"200",src:CFG.src||"coup-davance"});
  const r=await fetch("https://sportscore.com/api/v1/fixtures/?"+q,{signal:AbortSignal.timeout(20000)});
  if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();
  const a=Array.isArray(d)?d:(d.matches||d.data||d.results||d.fixtures||[]);return Array.isArray(a)?a:[]}
let stop=false;
$("stop").onclick=()=>{stop=true;$("stop").disabled=true};
$("go").onclick=async()=>{
  const days=Math.min(120,Math.max(1,+$("days").value||45)),dry=$("dry").checked;stop=false;
  $("go").disabled=true;$("stop").hidden=false;$("stop").disabled=false;$("log").textContent="";$("msg").textContent="";
  let seen=0,kept=0,added=0,fails=0;
  for(let i=1;i<=days&&!stop;i++){
    const date=new Date(Date.now()-i*864e5).toISOString().slice(0,10);
    $("msg").textContent="Jour "+i+" sur "+days+" ("+date+")…";
    let list;try{list=await day(date);fails=0}catch(e){L(date+" échec : "+(e.message||e));if(++fails>=5){L("5 échecs de suite : arrêt.");break}continue}
    const rows=list.map(norm).filter(Boolean);seen+=list.length;kept+=rows.length;let n=0;
    if(!dry)for(let k=0;k<rows.length;k+=200){
      const{data,error}=await sb.rpc("admin_import_history",{p:rows.slice(k,k+200)});
      if(error){L(date+" écriture : "+error.message);break}n+=data.new||0}
    added+=n;L(date+" : "+list.length+" lus, "+rows.length+" terminés"+(dry?"":", "+n+" nouveaux")+(list.length>=200?" (plafond 200)":""));
    await sleep(600)}
  $("msg").textContent=(stop?"Arrêté. ":"Terminé. ")+seen+" lus, "+kept+" retenus"+(dry?" (essai, rien écrit).":", "+added+" nouveaux ajoutés.");
  $("go").disabled=false;$("stop").hidden=true}
})();
</script></body></html>

<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1D6FD8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Hanken+Grotesk:wght@400;500;700&display=swap"><link rel="stylesheet" href="style.css"><title>Match – Pronos-bet</title></head><body><div class="wrap">
<header class="top"><a class="logo" href="index.html"><img src="icon.svg" alt="" width="34" height="34"><span>Pronos-bet</span></a><span id="who" hidden></span></header>
<a class="back" href="dashboard.html" id="back">← Retour aux matchs</a>
<div id="mh"><p class="sub">Chargement du match…</p></div>
<div id="pred"></div>
<div id="st"></div>
<div id="hs"></div>
<div id="l10"></div>
<div id="ev"></div>
<div style="height:40px"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script src="config.js"></script><script>
const $=i=>document.getElementById(i),sb=supabase.createClient(CFG.url,CFG.key);
</script><script src="cards.js"></script><script src="menu.js"></script><script>
const LIVE=["1H","2H","ET","BT","P","LIVE","INT","SUSP","HT"],DONE=["FT","AET","PEN"];
const ROWS=[["expected_goals","Buts attendus (xG)"],["Ball Possession","Possession"],["Total Shots","Total de tirs"],["Shots on Goal","Tirs cadrés"],["Shots off Goal","Tirs non cadrés"],["Blocked Shots","Tirs contrés"],["Shots insidebox","Tirs dans la surface"],["Shots outsidebox","Tirs hors de la surface"],["Corner Kicks","Corners"],["Fouls","Fautes"],["Offsides","Hors-jeu"],["Yellow Cards","Cartons jaunes"],["Red Cards","Cartons rouges"],["Goalkeeper Saves","Arrêts du gardien"],["goals_prevented","Buts évités"],["Total passes","Passes"],["Passes accurate","Passes réussies"],["Passes %","Précision des passes"]];
const num=v=>v==null?0:(parseFloat(String(v))||0);
const id=Number(new URLSearchParams(location.search).get("id"));
(async()=>{const{data:{session}}=await sb.auth.getSession();if(!session)return location.href="auth.html#login";
$("who").textContent=session.user.email;
if(document.referrer&&new URL(document.referrer).origin===location.origin){$("back").onclick=e=>{e.preventDefault();history.back()}}
if(!id){$("mh").innerHTML='<div class="card">Match introuvable.</div>';return}
let pr=null,d=null,meta=null;
const loadRow=async()=>{const{data}=await sb.from("predictions_safe").select("*").eq("fixture_id",id).maybeSingle();if(data)pr=data};
window.afterUnlock=r=>{pr=r;draw()};
await loadRow();
if(!pr){$("mh").innerHTML='<div class="card">Match introuvable.</div>';return}
try{const{data}=await sb.from("match_meta").select("*").eq("fixture_id",id).maybeSingle();meta=data}catch(e){}
document.title=pr.home+" – "+pr.away+" · Pronos-bet";
// 10 derniers matchs de chaque équipe, lus dans notre archive (table match_archive)
const SFX=["united","town","city","county","rovers","athletic","wanderers","albion","argyle","rvs","utd"];
const keysFor=k=>{const p=String(k||"").split(" "),ss=p.length>1&&SFX.includes(p[p.length-1])?p.slice(0,-1).join(" "):k;return[...new Set([k,ss])].filter(Boolean)};
const l10=async()=>{
  if(!pr.home_key||!pr.away_key)return;
  const blk=async(name,key)=>{const ks=keysFor(key),list=ks.map(x=>'"'+x+'"').join(",");
    const{data,error}=await sb.from("match_archive").select("*").or("home_key.in.("+list+"),away_key.in.("+list+")").order("kickoff",{ascending:false}).limit(10);
    if(error)return"";
    const rows=data||[];
    const li=rows.map(r=>{const home=ks.includes(r.home_key),gf=home?r.home_goals:r.away_goals,ga=home?r.away_goals:r.home_goals,opp=home?r.away:r.home,res=gf>ga?"V":gf<ga?"D":"N",
      dt=new Date(r.kickoff).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}),
      sm=(a,b)=>a!=null&&b!=null?a+b:null,
      st=[["Corners",sm(r.corners_home,r.corners_away)],["Fautes",sm(r.fouls_home,r.fouls_away)],["Jaunes",sm(r.yellow_home,r.yellow_away)],["Touches",sm(r.throwins_home,r.throwins_away)]].filter(x=>x[1]!=null).map(x=>x[0]+" "+x[1]).join(" · ");
      return '<div class="lr"><span class="ld">'+dt+'</span><span class="lo">'+(home?"vs ":"à ")+esc(opp)+(st?'<small>'+st+'</small>':"")+'</span><b class="ls">'+gf+' – '+ga+'</b><span class="frm"><i class="f'+res+'">'+res+'</i></span></div>'}).join("");
    return '<div class="lb"><h3>'+esc(name)+'</h3>'+(li||'<p class="note">Aucun match enregistré pour l’instant.</p>')+(rows.length&&rows.length<10?'<p class="note">'+rows.length+'/10 matchs enregistrés pour cette équipe.</p>':"")+'</div>'};
  const[h,a]=await Promise.all([blk(pr.home,pr.home_key),blk(pr.away,pr.away_key)]);
  if(h||a)$("l10").innerHTML='<div class="sec l10"><h2>10 derniers matchs</h2>'+h+a+'</div>'};
l10().catch(()=>{});
const lg=(u,c)=>u?'<img class="'+(c||"")+'" src="'+esc(u)+'" alt="" onerror="this.remove()">':"";
let lead=null;
const S=(h,a)=>{h=+h;a=+a;lead=h>a?"home":a>h?"away":null;return '<span class="g'+(lead==="home"?' w':'')+'">'+h+'</span> – <span class="g'+(lead==="away"?' w':'')+'">'+a+'</span>'};
const team=(side)=>{const t=(d&&d[side])||{},logo=t.logo||(meta&&meta[side+"_logo"]);
  return '<div class="t'+(lead===side?' win':'')+'">'+lg(logo)+'<b>'+esc(pr[side])+'</b></div>'};
const isLive=()=>(d&&LIVE.includes(d.status))||(!!pr.live_status&&!(pr.settled_at));
const draw=()=>{
  const lgLogo=(d&&d.league&&d.league.logo)||(meta&&meta.league_logo);
  let center="";
  const g=d&&d.goals&&d.goals.home!=null?d.goals:(pr.live_status?{home:pr.live_home,away:pr.live_away}:null);
  if(pr.settled_at&&pr.final_home!=null)center='<div class="scr">'+S(pr.final_home,pr.final_away)+'<small>Terminé</small></div>';
  else if(isLive()){const ht=(d&&d.status==="HT")||pr.live_status==="HT",mn=(d&&d.elapsed)||pr.live_minute;
    const hasG=g&&g.home!=null&&g.away!=null;
    center='<div class="scr live">'+(hasG?S(g.home,g.away):'– –')+'<small><span class="lv"><i></i>'+(ht?"MI-TEMPS":hasG?"EN COURS":"MATCH EN LIVE")+'</span>'+(!ht&&mn?' '+mn+'’':"")+'</small></div>'}
  else if(d&&DONE.includes(d.status)&&g)center='<div class="scr">'+S(g.home,g.away)+'<small>Terminé</small></div>';
  else if(new Date(pr.kickoff)<Date.now())center='<div class="scr">– –<small>Résultat en attente</small></div>';
  else center='<div class="scr" style="font-size:30px">'+new Date(pr.kickoff).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})+'<small>'+new Date(pr.kickoff).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})+'</small></div>';
  const extra=[d&&d.league&&d.league.round,d&&d.venue].filter(Boolean).join(" · ");
  $("mh").innerHTML='<div class="mh"><div class="lgl">'+lg(lgLogo,"lgo sm")+'<span>'+esc(pr.league||"")+(extra?' · '+esc(extra):"")+'</span></div><div class="tt">'+team("home")+center+team("away")+'</div></div>';
  $("pred").innerHTML=pr.data?'<div class="sec"><h2>Pronostic</h2><div class="mk" style="margin-bottom:8px">'+tagOf(pr)+'</div>'+(isOpen(pr)?probs(pr.data):lockBox(pr))+'</div>':"";
  // statistiques
  let st='<div class="sec"><h2>Statistiques du match</h2>';
  const hs=d&&d.statistics&&d.statistics.find(s=>s.team===d.home.id),as=d&&d.statistics&&d.statistics.find(s=>s.team===d.away.id);
  if(!d)st+='<p class="note">Chargement…</p>';
  else if(hs&&as){let n=0;
    const known=new Set(ROWS.map(r=>r[0])),more=[...new Set([...Object.keys(hs.stats),...Object.keys(as.stats)])].filter(k=>!known.has(k)).map(k=>[k,k.replace(/_/g," ")]);
    ROWS.concat(more).forEach(([k,lab])=>{const l=hs.stats[k],r=as.stats[k];if(l==null&&r==null)return;n++;
      const a=num(l),b=num(r),pct=/%/.test(String(l))||/%/.test(String(r)),mx=Math.max(a,b),
        wl=pct?a:(mx?a/mx*100:0),wr=pct?b:(mx?b/mx*100:0);
      st+='<div class="sr"><div class="sv"><b>'+fr(l==null?0:l)+'</b><span>'+lab+'</span><b>'+fr(r==null?0:r)+'</b></div><div class="sb"><div class="l"><i style="width:'+Math.min(100,wl)+'%"></i></div><div class="r"><i style="width:'+Math.min(100,wr)+'%"></i></div></div></div>'});
    if(!n)st+='<p class="note">Aucune statistique disponible pour le moment.</p>'}
  else if(d.noStats)st+='<p class="note">Les statistiques en direct ne sont pas disponibles pour cette compétition.</p>';
  else if(d.quota)st+='<p class="note">Limite quotidienne de requêtes atteinte : statistiques indisponibles pour le moment, réessaie plus tard.</p>';
  else if(isLive()||(pr.settled_at)||(d.status&&d.status!=="NS"))st+='<p class="note">Les statistiques de ce match ne sont pas encore disponibles.</p>';
  else st+='<p class="note">Les statistiques apparaîtront dès le coup d’envoi.</p>';
  $("st").innerHTML=st+'</div>';
  const fs=pr.final_stats,rowsHS=[["Corners","corners"],["Fautes","fouls"],["Touches","throwIns"],["Cartons jaunes","yellow"]].filter(r=>fs&&fs[r[1]]);
  $("hs").innerHTML=rowsHS.length?'<div class="sec"><h2>Statistiques officielles</h2>'+rowsHS.map(r=>'<div class="sr"><div class="sv"><b>'+fr(fs[r[1]][0]==null?0:fs[r[1]][0])+'</b><span>'+r[0]+'</span><b>'+fr(fs[r[1]][1]==null?0:fs[r[1]][1])+'</b></div></div>').join("")+'</div>':"";
  // événements
  const evs=((d&&d.events)||[]).filter(e=>["Goal","Card","subst","Var"].includes(e.type)).slice().reverse();
  const ic=e=>e.type==="Goal"?(e.detail==="Missed Penalty"?"❌":"⚽"):e.type==="Card"?(/Red/.test(e.detail||"")?"🟥":"🟨"):e.type==="subst"?"🔄":"📺";
  $("ev").innerHTML=evs.length?'<div class="sec"><h2>Temps forts</h2>'+evs.map(e=>{
    const home=d.home&&e.team===d.home.id,txt=ic(e)+' '+esc(e.player||"")+(e.type==="Goal"&&e.assist?'<small>passe : '+esc(e.assist)+'</small>':e.type==="subst"&&e.assist?'<small>entre : '+esc(e.assist)+'</small>':"");
    return '<div class="evr"><div class="h">'+(home?txt:"")+'</div><div class="m">'+(e.min==null?"":e.min+(e.extra?"+"+e.extra:"")+"’")+'</div><div class="a">'+(home?"":txt)+'</div></div>'}).join("")+'</div>':"";
};
const refresh=async()=>{
  await loadRow();
  if(pr.live_status&&!pr.settled_at){draw();return} // match en cours : pas d'appel API, on attend le score final
  try{const{data,error}=await sb.functions.invoke("match-info",{body:{action:"detail",id}});if(!error&&data&&!data.error)d=data}catch(e){}
  draw()};
draw();await refresh();
setInterval(()=>{if(document.hidden)return;if(pr.settled_at&&d&&d.statistics&&d.statistics.length)return;refresh()},45000);
})();
</script></body></html>

      return '<tr class="'+(isT(x)?"hl":"")+'"><td class="pos" style="box-shadow:inset 4px 0 0 '+esc(col(x.promo_color))+'">'+esc(x.pos??i+1)+'</td><td class="n">'+lg(x.team_logo)+'<span>'+esc(x.team||"")+'</span></td><td>'+esc(x.p??"")+'</td><td>'+esc(gd)+'</td><td class="pts">'+esc(x.pts??"")+'</td></tr>'}).join("")
    +'</tbody></table></div>').join("")};
const CTRY={"Spain": "Espagne", "England": "Angleterre", "Italy": "Italie", "Germany": "Allemagne", "France": "France", "Portugal": "Portugal", "Netherlands": "Pays-Bas", "Brazil": "Brésil", "USA": "États-Unis", "Belgium": "Belgique", "Turkey": "Turquie", "Scotland": "Écosse", "Argentina": "Argentine", "World": "Monde", "Europe": "Europe"};
const lgFull=(l,round)=>{const m=String(l||"").match(/^(.*?)\s*[\(\[]\s*([^)\]]+?)\s*[\)\]]\s*$/),name=(m?m[1]:String(l||"")).trim(),c=m?(CTRY[m[2].trim()]||m[2].trim()):"",rs=String(round||""),n=/final|round of|play-?off|group|knockout|qualif|\d\/\d/i.test(rs)?null:rs.match(/\d+/);
  return[c,name,n?"Tour "+n[0]:""].filter(Boolean).join(". ")};
const p2=n=>String(n).padStart(2,"0");
const fmtK=t=>{const x=new Date(t),h=x.getHours(),ap=h>=12?"PM":"AM";return p2(x.getDate())+"."+p2(x.getMonth()+1)+"."+x.getFullYear()+" ("+p2(h%12||12)+":"+p2(x.getMinutes())+" "+ap+")"};
const cdTxt=t=>{let s=Math.max(0,Math.floor((new Date(t)-Date.now())/1e3));const d=Math.floor(s/86400);s%=86400;return(d?d+"j ":"")+p2(Math.floor(s/3600))+":"+p2(Math.floor(s%3600/60))+":"+p2(s%60)};
setInterval(()=>{const e=document.getElementById("cd");if(!e||!pr)return;if(new Date(pr.kickoff)<=Date.now()){e.remove();return}e.textContent=cdTxt(pr.kickoff)},1000);
const draw=()=>{
  drawForme();
  const lgLogo=(d&&d.league&&d.league.logo)||(meta&&meta.league_logo);
  let center="";
  const g=d&&d.goals&&d.goals.home!=null?d.goals:(pr.live_status?{home:pr.live_home,away:pr.live_away}:null);
  if(pr.settled_at&&pr.final_home!=null)center='<div class="scr">'+S(pr.final_home,pr.final_away)+'<small>Terminé</small></div>';
  else if(isLive()){const ht=(d&&d.status==="HT")||pr.live_status==="HT",mn=(d&&d.elapsed)||pr.live_minute;
    const hasG=g&&g.home!=null&&g.away!=null;
    center='<div class="scr live">'+(hasG?S(g.home,g.away):'– –')+'<small><span class="lv"><i></i>'+(ht?"MI-TEMPS":hasG?"EN COURS":"MATCH EN LIVE")+'</span>'+(!ht&&mn?' '+mn+'’':"")+'</small></div>'}
  else if(d&&DONE.includes(d.status)&&g)center='<div class="scr">'+S(g.home,g.away)+'<small>Terminé</small></div>';
  else if(new Date(pr.kickoff)<Date.now())center='<div class="scr">– –<small>Résultat en attente</small></div>';
  else center='<div class="scr" style="font-size:30px">'+new Date(pr.kickoff).toLocaleTimeString((window.PB?PB.loc():"fr-FR"),{hour:"2-digit",minute:"2-digit"})+'<small>'+new Date(pr.kickoff).toLocaleDateString((window.PB?PB.loc():"fr-FR"),{weekday:"short",day:"numeric",month:"short"})+'</small></div>';
  const upcoming=!pr.settled_at&&!isLive()&&new Date(pr.kickoff)>Date.now();
  const head='<div class="lgh"><div class="lgl">'+lg(lgLogo,"lgo sm")+'<span>'+esc(lgFull(pr.league,(d&&d.league&&d.league.round)||RND))+'</span></div><div class="lgd">'+(upcoming?'<span id="cd" class="cdp">'+cdTxt(pr.kickoff)+'</span>':'')+'<span>'+esc(fmtK(pr.kickoff))+'</span></div></div>';
  $("mh").innerHTML='<div class="mh">'+head+'<div class="tt">'+team("home")+center+team("away")+'</div></div>';
  // Panneau Pronostics : 3 états (avant-match / direct / terminé), calculé à partir du pronostic stocké + score
  const isDone=!!(pr.settled_at&&pr.final_home!=null)||!!(d&&DONE.includes(d.status)&&g),isLv=!isDone&&isLive();
  const sx=d&&d.statistics&&d.statistics.find(s=>d.home&&s.team===d.home.id),sy=d&&d.statistics&&d.statistics.find(s=>d.away&&s.team===d.away.id);
  const ctx={st:isDone?"done":isLv?"live":"next",
    h:isDone?(pr.final_home!=null?pr.final_home:g.home):g&&g.home,a:isDone?(pr.final_away!=null?pr.final_away:g.away):g&&g.away,
    ht:(d&&d.status==="HT")||pr.live_status==="HT",min:(d&&d.elapsed)||pr.live_minute,
    xg:sx&&sy&&sx.stats.expected_goals!=null&&sy.stats.expected_goals!=null?[num(sx.stats.expected_goals),num(sy.stats.expected_goals)]:null,
    red:sx&&sy?[num(sx.stats["Red Cards"]),num(sy.stats["Red Cards"])]:null,
    // buts (minute + camp) pour rejouer le match et tracer la courbe des probabilités
    ev:d&&d.events&&d.home?d.events.filter(e=>e.type==="Goal"&&e.detail!=="Missed Penalty"&&e.min!=null&&e.min<=125).map(e=>({m:e.min,h:e.team===d.home.id,og:/Own/i.test(e.detail||"")})):null};
  const body=!pr.data?"":!isOpen(pr)?lockBox(pr):(drift(pr)||(ctx.st!=="next"&&ctx.h==null))?(drift(pr)?origBox(pr):probs(pr.data)):ppRender(pr,ctx);
  $("pred").innerHTML=pr.data?'<div class="sec"><h2>Pronostics</h2><div class="mk" style="margin-bottom:10px">'+tagOf(pr)+'</div><div class="pc-solo">'+body+'</div></div>':"";
  drawOdds();
  // statistiques
  let st='<div class="sec"><h2>Statistiques du match</h2>';
  const hs=d&&d.statistics&&d.statistics.find(s=>s.team===d.home.id),as=d&&d.statistics&&d.statistics.find(s=>s.team===d.away.id);
  if(!d)st+='<p class="note">Chargement…</p>';
  else if(hs&&as){let n=0;
    const known=new Set(ROWS.map(r=>r[0])),more=[...new Set([...Object.keys(hs.stats),...Object.keys(as.stats)])].filter(k=>!known.has(k)).map(k=>[k,k.replace(/_/g," ")]);
    ROWS.concat(more).forEach(([k,lab])=>{const l=hs.stats[k],r=as.stats[k];if(l==null&&r==null)return;n++;
      const a=num(l),b=num(r),pct=/%/.test(String(l))||/%/.test(String(r)),mx=Math.max(a,b),
        wl=pct?a:(mx?a/mx*100:0),wr=pct?b:(mx?b/mx*100:0);
      st+='<div class="sr"><div class="sv"><b>'+fr(l==null?0:l)+'</b><span>'+lab+'</span><b>'+fr(r==null?0:r)+'</b></div><div class="sb"><div class="l"><i style="width:'+Math.min(100,wl)+'%"></i></div><div class="r"><i style="width:'+Math.min(100,wr)+'%"></i></div></div></div>'});
    if(!n)st+='<p class="note">Aucune statistique disponible pour le moment.</p>'}
  else if(d.noStats)st+='<p class="note">Les statistiques en direct ne sont pas disponibles pour cette compétition.</p>';
  else if(d.quota)st+='<p class="note">Limite quotidienne de requêtes atteinte : statistiques indisponibles pour le moment, réessaie plus tard.</p>';
  else if(isLive()||(pr.settled_at)||(d.status&&d.status!=="NS"))st+='<p class="note">Les statistiques de ce match ne sont pas encore disponibles.</p>';
  else st+='<p class="note">Les statistiques apparaîtront dès le coup d’envoi.</p>';
  $("st").innerHTML=st+'</div>';
  const fs=pr.final_stats,rowsHS=[["Corners","corners"],["Fautes","fouls"],["Touches","throwIns"],["Cartons jaunes","yellow"]].filter(r=>fs&&fs[r[1]]);
  $("hs").innerHTML=rowsHS.length?'<div class="sec"><h2>Statistiques officielles</h2>'+rowsHS.map(r=>'<div class="sr"><div class="sv"><b>'+fr(fs[r[1]][0]==null?0:fs[r[1]][0])+'</b><span>'+r[0]+'</span><b>'+fr(fs[r[1]][1]==null?0:fs[r[1]][1])+'</b></div></div>').join("")+'</div>':"";
  // événements
  const evs=((d&&d.events)||[]).filter(e=>["Goal","Card","subst","Var"].includes(e.type)).slice().reverse();
  const ic=e=>e.type==="Goal"?(e.detail==="Missed Penalty"?"❌":"⚽"):e.type==="Card"?(/Red/.test(e.detail||"")?"🟥":"🟨"):e.type==="subst"?"🔄":"📺";
  $("ev").innerHTML=evs.length?'<div class="sec"><h2>Temps forts</h2>'+evs.map(e=>{
    const home=d.home&&e.team===d.home.id,txt=ic(e)+' '+esc(e.player||"")+(e.type==="Goal"&&e.assist?'<small>passe : '+esc(e.assist)+'</small>':e.type==="subst"&&e.assist?'<small>entre : '+esc(e.assist)+'</small>':"");
    return '<div class="evr"><div class="h">'+(home?txt:"")+'</div><div class="m">'+(e.min==null?"":e.min+(e.extra?"+"+e.extra:"")+"’")+'</div><div class="a">'+(home?"":txt)+'</div></div>'}).join("")+'</div>':"";
};
const refresh=async()=>{
  await loadRow();
  if(inPlay()){draw();return}
  await loadDetail();
  draw()};
// Démarrage : avec la ligne mémorisée, on affiche tout de suite puis on lance TOUT en parallèle ; sans elle (lien direct, notification), ligne + logos en parallèle
// Match du direct sans pronostic (lien des notifications de but) : score, minute et statut, actualisés tout seuls
async function liveOnly(){
  const get=async()=>{try{const{data}=await sb.from("live_matches").select("*").eq("id",id).maybeSingle();return data}catch(e){return null}};
  let m=await get();if(!m)return false;
  // Page du match en direct (SportScore) : on retrouve le match par les noms d'équipes et l'heure, puis on y va directement
  $("mh").innerHTML='<p class="sub" style="text-align:center;text-transform:none">Ouverture du match en direct…</p>';
  try{
    const x={home:m.home,away:m.away,t:Date.parse(m.kickoff)||0};
    const same=y=>ssSameMatch(x,{home:y.home,away:y.away,t:+new Date(y.start)||0},6);
    let f=(await ssLive()).find(same);
    if(!f){const d=m.kickoff?new Date(m.kickoff).toISOString().slice(0,10):undefined;f=(await ssToday(d)).find(same)}
    if(f&&f.id){location.replace("sport.html#match/"+encodeURIComponent(f.id)+(f.mid&&f.mid!==f.id?"/"+encodeURIComponent(f.mid):""));return true}
  }catch(e){}
  const draw=()=>{
    const fin=m.status==="finished",ht=m.status==="ht",lv=m.status==="live",sc=m.home_score!=null&&m.away_score!=null;
    const st=fin?"Terminé":ht?"Mi-temps":lv?(m.minute!=null?m.minute+"’":"En direct"):new Date(m.kickoff).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    $("mh").innerHTML='<div class="card" style="text-align:center">'
      +(m.league?'<p class="sub" style="margin:0 0 10px">'+esc(m.league)+'</p>':'')
      +'<div style="display:flex;align-items:center;justify-content:space-between;gap:10px">'
      +'<b style="flex:1;font-size:17px">'+esc(m.home)+'</b>'
      +'<span style="flex:none;font:800 34px/1 \'Bricolage Grotesque\',sans-serif">'+(sc?esc(m.home_score)+' - '+esc(m.away_score):'vs')+'</span>'
      +'<b style="flex:1;font-size:17px">'+esc(m.away)+'</b></div>'
      +'<p style="margin:12px 0 0;font-weight:700;color:'+(lv?'#e5322d':'inherit')+'">'+(lv?'● ':'')+esc(st)+'</p></div>'
      +'<p class="sub" style="text-align:center;margin:14px 0;text-transform:none">Pas de pronostic pour ce match.</p>'
      +'<p style="text-align:center;margin:0 0 16px"><a href="sport.html">Voir tous les matchs en direct</a></p>';
  };
  draw();
  setInterval(async()=>{if(document.hidden||m.status==="finished")return;const n=await get();if(n){m=n;draw()}},30000);
  return true;
}
if(hadCache){
  startSide();draw();
  const det=inPlay()?Promise.resolve():loadDetail();
  await Promise.all([loadRow(),loadMeta()]);
  startSide();draw();
  await det;draw();
}else{
  await Promise.all([loadRow(),loadMeta()]);
  if(!pr){await sessP;if(await liveOnly())return;$("mh").innerHTML='<div class="card">Match introuvable.</div><p style="text-align:center;margin:16px 0"><a href="sport.html">Voir les matchs en direct</a></p>';return}
  startSide();draw();
  if(!inPlay()){await loadDetail();draw()}
}
setInterval(()=>{if(document.hidden)return;if(pr.settled_at&&d&&d.statistics&&d.statistics.length)return;refresh()},45000);

// ---- Vidéos Highlightly : clips de buts (pendant le match) et résumé officiel (après le match) ----
const VH=["youtube.com","youtube-nocookie.com","youtu.be","streamable.com","vimeo.com","dailymotion.com","twitter.com","x.com","rumble.com"];
const okHost=u=>{try{const x=new URL(u),h=x.hostname.toLowerCase();return x.protocol==="https:"&&VH.some(d=>h===d||h.endsWith("."+d))}catch(e){return false}};
const vTile=(v,k)=>'<div class="vtile"><button type="button" class="vplay" data-k="'+k+'" aria-label="Lancer la vidéo : '+esc(v.title)+'">'+(v.imgUrl?'<img src="'+esc(v.imgUrl)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'')+'<i></i></button><div class="vcap">'+esc(v.title)+'<small>'+esc([v.channel||v.source].filter(Boolean).join(" · "))+'</small></div></div>';
let vdData=null,vdSig="",vdNext=0,vdBusy=false;
const vdDraw=d=>{
  const el=$("vd");
  if(!d||d.phase==="pre"){el.innerHTML="";vdSig="";return}
  const live=d.phase==="live",clips=d.clips||[],recap=d.recap||[],hrs=(Date.now()-Date.parse(pr.kickoff))/36e5;
  const sig=d.phase+"|"+recap.map(v=>v.id).join(",")+"|"+clips.map(v=>v.id).join(",");
  if(sig===vdSig||el.querySelector("iframe"))return; // rien de nouveau, ou une vidéo est en cours de lecture : on ne la coupe pas
  vdSig=sig;
  const R=recap.length?'<div class="sec vd"><h2>Résumé du match <span class="vb ok">Officiel ✓</span></h2>'+recap.map((v,i)=>vTile(v,"r"+i)).join("")+'</div>'
    :(!live&&hrs<60?'<div class="sec vd"><h2>Résumé du match</h2><p class="note">Le résumé officiel arrive en général entre 1 h et 48 h après la fin du match.</p></div>':"");
  const C=clips.length?'<div class="sec vd"><h2>'+(live?"Buts en direct":"Clips de buts")+' <span class="vb un">Non vérifié</span></h2><p class="note">Ces clips viennent souvent d’internautes (Twitter, YouTube). Ils arrivent quelques minutes après le but et peuvent être retirés à tout moment.</p>'+clips.map((v,i)=>vTile(v,"c"+i)).join("")+'</div>'
    :(live?'<div class="sec vd"><h2>Buts en direct</h2><p class="note">Les clips des buts apparaissent ici quelques minutes après chaque but.</p></div>':"");
  el.innerHTML=live?C+R:R+C;
};
const vdLoad=async()=>{
  if(vdBusy)return;vdBusy=true;
  try{const{data,error}=await sb.functions.invoke("match-videos",{body:{id}});
    if(!error&&data&&!data.error){vdData=data;vdDraw(data)}}catch(e){}
  const ph=vdData&&vdData.phase;
  vdNext=!vdData?Date.now()+300e3
    :vdData.old?Infinity
    :ph==="live"?Date.now()+90e3
    :ph==="pre"?Date.now()+60e3
    :(vdData.recap&&vdData.recap.length)?Infinity   // le résumé officiel reste en ligne : plus rien à redemander
    :Date.now()+600e3;
  vdBusy=false};
$("vd").addEventListener("click",e=>{
  const b=e.target.closest(".vplay");if(!b||!vdData)return;
  const k=b.dataset.k,v=(k[0]==="r"?vdData.recap:vdData.clips)[+k.slice(1)];if(!v)return;
  if(v.embedUrl&&okHost(v.embedUrl)){
    b.parentNode.innerHTML='<iframe src="'+esc(v.embedUrl)+'" title="'+esc(v.title)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-scripts allow-same-origin allow-presentation allow-popups allow-popups-to-escape-sandbox"></iframe><a class="vopen" href="'+esc(v.url)+'" target="_blank" rel="noopener noreferrer">Ouvrir sur le site d’origine ↗</a>';
  }else window.open(v.url,"_blank","noopener,noreferrer")});
vdLoad();
setInterval(()=>{if(document.hidden||vdBusy||Date.now()<vdNext)return;vdLoad()},15000);
})();
</script><script>

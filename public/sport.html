<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1D6FD8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Hanken+Grotesk:wght@400;500;700&display=swap"><link rel="stylesheet" href="style.css"><title>Football en direct – Pronos-bet</title></head><body><div class="wrap">
<header class="top"><a class="logo" href="index.html"><img src="icon.svg" alt="" width="34" height="34"><span>Pronos-bet</span></a></header>
<h1 class="pt">Football en direct</h1>
<p class="sx-lead">Scores, classements, buteurs et tableaux des compétitions.</p>
<nav class="sx-tabs" id="tabs" aria-label="Sections"><a href="#matches">En direct</a><a href="#standings">Classements</a><a href="#scorers">Buteurs</a><a href="#bracket">Tableaux</a><a href="#tracker">Suivi live</a></nav>
<div id="chips" class="sx-chips"></div>
<div id="v"><p class="sub">Chargement…</p></div>
<details class="note" id="dbg" hidden style="margin-top:22px"><summary>Diagnostic</summary><pre id="dbgp" class="sx-dbg"></pre></details>
<p class="note sx-credit">Données : <a href="https://sportscore.com" target="_blank" rel="noopener">Powered by SportScore</a></p><div style="height:40px"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script src="config.js"></script><script>
const $=i=>document.getElementById(i),sb=supabase.createClient(CFG.url,CFG.key);
</script><script src="cards.js"></script><script src="sportscore.js"></script><script src="menu.js"></script><script>
let COMP=null,TIMER=null,COMPS=[],MODE="goals",FILTER="all",QUERY="",LIM=50,MATCHES=[];
const DEBUG=/[?&]debug=1/.test(location.search);

// Compétitions proposées. Ces identifiants (slugs) ont été vérifiés auprès de SportScore.
// Attention : « premier-league » seul n'existe pas pour les classements, il faut « english-premier-league ».
const POP=[["Premier League","english-premier-league"],["Champions League","uefa-champions-league"],["La Liga","spanish-la-liga"],["Serie A","italian-serie-a"],["Bundesliga","bundesliga"],["Ligue 1","french-ligue-1"],["Europa League","uefa-europa-league"],["Brasileirão","brazilian-serie-a"],["MLS","united-states-major-league-soccer"],["Coupe du monde","fifa-world-cup"]];

// Suivi live compact (comme 1xBet) : on n'affiche que le terrain et le score ; « Agrandir » montre le lecteur en entier.
const trkBox=id=>'<div class="sx-trk"><div class="v"><iframe src="'+esc("https://sportscore.com/api/widget/tracker/?sport=football&id="+encodeURIComponent(id)+"&src="+encodeURIComponent((window.CFG||{}).src||""))+'" title="Suivi du match en direct" loading="lazy" allow="fullscreen" sandbox="allow-same-origin allow-scripts allow-popups"></iframe></div><button type="button" class="sx-trk-b" data-trk>Agrandir</button></div>';
const lg=(u,c)=>u?'<img class="'+(c||"")+'" src="'+esc(u)+'" alt="" loading="lazy" referrerpolicy="no-referrer" draggable="false" onload="if(this.naturalWidth<3)this.remove()" onerror="this.remove()">':"";
const err=e=>'<div class="card sx-err"><b>Données indisponibles pour le moment</b><span>'+esc(ssErr(e))+'</span></div>';
const hm=s=>{const d=new Date(typeof s==="number"&&s<1e12?s*1000:s);return isNaN(d)?"":d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})};
const mgo=x=>"match/"+esc(x.id)+(x.mid?"/"+esc(x.mid):"");

// Ligne de match : état à gauche, équipes empilées, scores à droite.
// go : route au clic (undefined = fiche du match, "" = pas de lien)
const mrow=(x,go)=>{
  const sc=x.hs!=null&&x.as!=null,g=go===""?"":' data-go="'+(go||mgo(x))+'"';
  const st=x.live?'<span class="sx-live"><i></i>'+(x.minute?esc(x.minute)+"’":"LIVE")+'</span>':x.done?'<span>Terminé</span>':'<span>'+(hm(x.start)||"vs")+'</span>';
  return'<div class="sx-m'+(x.live?" lv":"")+'"'+g+'><div class="st">'+st+'</div>'
   +'<div class="tm"><div>'+lg(x.hl)+'<span>'+esc(x.home)+'</span></div><div>'+lg(x.al)+'<span>'+esc(x.away)+'</span></div></div>'
   +'<div class="sc">'+(sc?'<b>'+esc(x.hs)+'</b><b>'+esc(x.as)+'</b>':'<b>–</b><b>–</b>')+'</div></div>'};

// Initiales affichées quand un joueur n'a pas de photo
const ini=n=>String(n||"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const page=()=>(location.hash.slice(1)||"matches").split("/")[0];
const chips=()=>{const el=$("chips");
  if(!COMPS.length||!/^(standings|scorers|bracket)$/.test(page())){el.innerHTML="";return}
  el.innerHTML=COMPS.map(c=>'<button type="button" data-c="'+esc(c.id)+'" class="'+(String(COMP)===String(c.id)?"on":"")+'">'+esc(c.name)+'</button>').join("");
  const on=el.querySelector(".on");if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest",inline:"center"})};

async function loadComps(){if(COMPS.length)return;
  POP.forEach(([name,id])=>COMPS.push({id,name}));
  if(COMP==null)COMP=COMPS[0].id}

// Appelle un endpoint pour la compétition choisie
const byComp=(endpoint,extra)=>SS(endpoint,Object.assign({slug:COMP},extra||{}));

const evIcon=e=>{const t=String(e.type||"").toLowerCase();
  return e.is_sub||/subst/.test(t)?"🔄":/red/.test(t)?"🟥":e.is_card||/yellow|card/.test(t)?"🟨":/goal|penalty/.test(t)?"⚽":/var/.test(t)?"📺":""};
// Une ligne d'évènement : domicile à gauche, minute au centre, extérieur à droite
const evRow=e=>{const ic=evIcon(e),sub=e.is_sub||/subst/i.test(e.type||"");
  const who=sub?esc(e.player_in||"")+'<small>remplace '+esc(e.player_out||"")+'</small>'
    :esc(ssName(ssPick(e,["player","player_name","name"]))||"")+(ic?"":'<small>'+esc(e.type||"")+'</small>');
  const cell=(ic?ic+" ":"")+who,min=ssPick(e,["time","minute","min"]);
  return'<div class="evr"><div class="h">'+(e.side==="home"?cell:"")+'</div><div class="m">'+(min==null?"":esc(min)+"’")+'</div><div class="a">'+(e.side==="away"?cell:"")+'</div></div>'};

// En-tête de match (même style que la page match.html)
const mhead=m=>{const sc=m.hs!=null&&m.as!=null,w=sc?(+m.hs>+m.as?"home":+m.as>+m.hs?"away":""):"";
  const centre=sc?'<div class="scr'+(m.live?" live":"")+'"><span class="g'+(w==="home"?" w":"")+'">'+esc(m.hs)+'</span> – <span class="g'+(w==="away"?" w":"")+'">'+esc(m.as)+'</span><small>'+(m.live?'<span class="lv"><i></i>EN COURS</span>'+(m.minute?" "+esc(m.minute)+"’":""):m.done?"Terminé":"")+'</small></div>'
    :'<div class="scr" style="font-size:30px">'+(hm(m.start)||"vs")+'<small>À venir</small></div>';
  return'<div class="mh"><div class="lgl">'+lg(m.cl,"lgo sm")+'<span>'+esc(m.comp||"")+'</span></div><div class="tt"><div class="t'+(w==="home"?" win":"")+'">'+lg(m.hl)+'<b>'+esc(m.home)+'</b></div>'+centre+'<div class="t'+(w==="away"?" win":"")+'">'+lg(m.al)+'<b>'+esc(m.away)+'</b></div></div></div>'};

// ---- pages ----
const P={
 async matches(){
  const all=await ssToday();
  if(!all.length)return'<div class="card">Aucun match pour le moment.</div>';
  MATCHES=all;
  const n={all:all.length,live:all.filter(m=>m.live).length,done:all.filter(m=>m.done).length,next:all.filter(m=>!m.live&&!m.done).length};
  const fl=[["all","Tous"],["live","En direct"],["done","Terminés"],["next","À venir"]].map(([k,l])=>'<button type="button" data-f="'+k+'" class="'+(FILTER===k?"on":"")+'">'+l+' <small>'+n[k]+'</small></button>').join("");
  return'<div class="srch"><input id="sq" type="search" placeholder="Rechercher une équipe ou une compétition…" autocomplete="off" value="'+esc(QUERY)+'" aria-label="Rechercher un match"></div><div class="sx-chips sx-flt">'+fl+'</div><div id="mlist">'+mlist()+'</div>'},

 async match(slug,mid){let d;
  try{d=await SS("match",{slug})}catch(e){if(!mid)throw e;d=await SS("match",{slug:mid})}
  const r=d.match||d.data||d,m=ssMatch(r);if(!m.id)m.id=slug;if(!m.mid)m.mid=mid;
  let h='<a class="back" href="#matches">← Retour aux matchs</a>'+mhead(m);
  if(r.home_ht_score!=null&&r.away_ht_score!=null&&m.hs!=null)h+='<p class="note" style="text-align:center">Mi-temps : '+esc(r.home_ht_score)+' – '+esc(r.away_ht_score)+'</p>';
  const tid=ssPick(r,["tracker.id"])||m.mid||mid;
  if(tid&&m.live)h+=trkBox(tid);
  else if(tid&&!m.done)h+='<p style="text-align:center;margin:14px 0"><a class="btn sx-btn" href="#tracker/'+esc(tid)+'">▶ Suivre en direct</a></p>';
  const ev=ssArr(r,["incidents","events","timeline"]);
  if(ev.length)h+='<div class="sec"><h2>Temps forts</h2>'+ev.slice().reverse().map(evRow).join("")+'</div>';
  const stt=ssPick(r,["statistics","stats"]);
  if(Array.isArray(stt)&&stt.length)h+='<div class="sec"><h2>Statistiques</h2>'+stt.map(s=>'<div class="sr"><div class="sv"><b>'+esc(ssPick(s,["home","home_value"])??"")+'</b><span>'+esc(ssPick(s,["name","type","label"])||"")+'</span><b>'+esc(ssPick(s,["away","away_value"])??"")+'</b></div></div>').join("")+'</div>';
  const L=r.lineups;
  if(L&&((L.home_xi||[]).length||(L.away_xi||[]).length)){
    const col=(s,n)=>'<div class="sx-xi"><b>'+esc(n)+(L[s+"_formation"]?' · '+esc(L[s+"_formation"]):"")+'</b>'+(L[s+"_coach"]?'<small>Coach : '+esc(ssName(L[s+"_coach"]))+'</small>':"")
      +(L[s+"_xi"]||[]).map(p=>'<div>'+esc(p.number??"")+' '+esc(p.name)+(p.captain?" (C)":"")+'</div>').join("")
      +((L[s+"_subs"]||[]).length?'<small>Remplaçants</small>'+L[s+"_subs"].map(p=>'<div>'+esc(p.number??"")+' '+esc(p.name)+'</div>').join(""):"")+'</div>';
    h+='<div class="sec"><h2>Compositions'+(L.confirmed?"":" (probables)")+'</h2><div class="sx-kv2">'+col("home",m.home)+col("away",m.away)+'</div></div>'}
  if(!ev.length&&!(Array.isArray(stt)&&stt.length))h+='<div class="sec"><p class="note">Pas encore de détails pour ce match.</p></div>';
  return h+'<p class="chk">'+(m.hid?'<a href="#team/'+esc(m.hid)+'">Matchs de '+esc(m.home)+' ›</a>':'')+(m.hid&&m.aid?' · ':'')+(m.aid?'<a href="#team/'+esc(m.aid)+'">Matchs de '+esc(m.away)+' ›</a>':'')+'</p>'},

 async team(slug){const d=await SS("team",{slug,limit:30}),t=d.team||{},ms=ssArr(d).map(ssMatch);
  return'<a class="back" href="javascript:history.back()">← Retour</a><div class="sx-ph">'+lg(t.logo,"big")+'<div><h2>'+esc(t.name||slug)+'</h2><small>Derniers et prochains matchs</small></div></div>'
   +(ms.length?ms.map(m=>mrow(m)).join(""):'<div class="card">Aucun match trouvé pour cette équipe.</div>')},

 async standings(){await loadComps();chips();const d=await byComp("standings"),tabs=Array.isArray(d.tables)?d.tables:[];
  const T=g=>{const rows=g.rows||[];
    const body=rows.map((x,i)=>{const sl=x.team_slug||"",col=x.promo_color||"transparent";
      return'<tr'+(sl?' data-go="team/'+esc(sl)+'"':'')+'><td class="pos" style="box-shadow:inset 4px 0 0 '+esc(col)+'">'+esc(x.pos??i+1)+'</td><td class="n">'+lg(x.team_logo)+'<span>'+esc(x.team||"")+'</span></td>'
       +'<td>'+esc(x.p??"")+'</td><td>'+esc(x.w??"")+'</td><td>'+esc(x.d??"")+'</td><td>'+esc(x.l??"")+'</td><td>'+esc(x.gd??"")+'</td><td class="pts">'+esc(x.pts??"")+'</td></tr>'}).join("");
    const lgd={};rows.forEach(x=>{if(x.promo_name&&x.promo_color)lgd[x.promo_name]=x.promo_color});
    return'<div class="sec">'+(g.group?'<h2>'+esc(g.group)+'</h2>':'')+'<div class="sx-tw"><table class="sx-tb"><thead><tr><th>#</th><th class="n">Équipe</th><th>J</th><th>G</th><th>N</th><th>P</th><th>+/-</th><th>Pts</th></tr></thead><tbody>'+body+'</tbody></table></div>'
     +(Object.keys(lgd).length?'<div class="sx-lgd">'+Object.keys(lgd).map(k=>'<span><i style="background:'+esc(lgd[k])+'"></i>'+esc(k)+'</span>').join("")+'</div>':'')+'</div>'};
  const ok=tabs.filter(g=>(g.rows||[]).length);
  if(!ok.length)return'<div class="card">Aucun classement disponible pour cette compétition.</div>';
  return(d.competition?'<div class="sx-ph">'+lg(d.competition_logo,"big")+'<div><h2>'+esc(d.competition)+'</h2><small>Classement actuel</small></div></div>':'')+ok.map(T).join("")},

 async scorers(){await loadComps();chips();const d=await byComp("topscorers",{limit:30,stat:MODE}),rows=Array.isArray(d.scorers)?d.scorers:ssArr(d);
  const sw='<div class="sx-chips sx-flt"><button type="button" data-m="goals" class="'+(MODE==="goals"?"on":"")+'">⚽ Buteurs</button><button type="button" data-m="assists" class="'+(MODE==="assists"?"on":"")+'">🎯 Passeurs</button></div>';
  if(!rows.length)return sw+'<div class="card">Aucune donnée pour cette compétition.</div>';
  return sw+'<div class="sec sx-list">'+rows.map((x,i)=>{
    const nm=ssName(x.player),sl=x.player_slug||"",val=ssPick(x,[MODE==="goals"?"goals":"assists","value","count","total"])??"";
    return'<div class="sx-pl"'+(sl?' data-go="player/'+esc(sl)+'"':'')+'><span class="rk">'+esc(x.rank??i+1)+'</span><span class="av" data-i="'+esc(ini(nm))+'">'+lg(x.player_logo)+'</span>'
     +'<div class="nm"><b>'+esc(nm)+'</b><small>'+lg(x.team_logo,"tl")+esc(ssName(x.team))+(x.matches!=null?' · '+esc(x.matches)+' matchs':'')+'</small></div><span class="v">'+esc(val)+'</span></div>'}).join("")+'</div>'},

 async player(slug){const d=await SS("player",{slug}),p=d.player||{},s=d.stats||{};
  const LAB=[["matches","Matchs"],["goals","Buts"],["assists","Passes déc."],["minutes","Minutes"],["yellow_cards","Cartons jaunes"],["red_cards","Cartons rouges"],["shots","Tirs"],["shots_on_target","Tirs cadrés"],["key_passes","Passes clés"],["dribbles","Dribbles"],["tackles","Tacles"],["interceptions","Interceptions"],["passes","Passes"],["passes_accuracy","Passes réussies"]];
  const items=LAB.filter(([k])=>s[k]!=null).map(([k,l])=>'<div><span>'+l+'</span><b>'+esc(s[k])+'</b></div>').join("");
  return'<a class="back" href="javascript:history.back()">← Retour</a><div class="sx-ph">'+lg(p.logo,"big round")+'<div><h2>'+esc(p.name||slug)+'</h2><small>'+lg(s.team_logo,"tl")+esc(s.team||"")+(s.competition?' · '+esc(s.competition):'')+'</small></div></div>'
   +'<div class="sec"><h2>Statistiques</h2>'+(items?'<div class="sx-kv">'+items+'</div>':'<p class="note">Aucune statistique disponible.</p>')+'</div>'},

 async bracket(){await loadComps();chips();const d=await byComp("bracket"),rounds=Array.isArray(d.rounds)?d.rounds:ssArr(d,["rounds","stages"]);
  const rd=rounds.map(r=>({name:ssPick(r,["name","round","title"])||"",ms:ssArr(r,["matchups","matches","ties"])})).filter(r=>r.ms.length);
  if(!rd.length)return'<div class="card">Pas de tableau disponible pour cette compétition.</div>';
  return(d.competition?'<div class="sx-ph">'+lg(d.competition_logo,"big")+'<div><h2>'+esc(d.competition)+'</h2><small>Tableau de la compétition</small></div></div>':'')
   +'<div class="sx-brk">'+rd.map(r=>'<div class="col"><h4>'+esc(r.name)+'</h4>'+r.ms.map(m=>{
     const w=m.winner,sc=m.home_score!=null&&m.away_score!=null;
     const line=(t,logo,s,win)=>'<div class="'+(win?"w":"")+'"><span>'+lg(logo)+esc(t||"?")+'</span><b>'+esc(sc?s:"")+'</b></div>';
     return'<div class="bm">'+line(m.home,m.home_logo,m.home_score,w&&w===m.home)+line(m.away,m.away_logo,m.away_score,w&&w===m.away)+'</div>'}).join("")+'</div>').join("")+'</div>'},

 async tracker(id){
  if(!id){const ms=await ssLive();
   return'<div class="sec"><h2>Choisis un match en direct</h2>'+(ms.length?ms.map(m=>mrow(m,m.mid?"tracker/"+esc(m.mid):"")).join(""):'<p class="note">Aucun match en direct pour le moment.</p>')+'</div>'}
  return'<a class="back" href="#tracker">← Retour</a>'+trkBox(id)+'<p class="note" style="text-align:center">Suivi live fourni par SportScore.</p>'}
};

// Liste des matchs : filtre (onglets + recherche), grandes compétitions en premier, 50 matchs affichés à la fois
const nz=t=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const PRIO=/^(english premier league|spanish la liga|italian serie a|french ligue 1|bundesliga|uefa champions league|uefa europa league|brazilian serie a)$/i;
function mlist(){
  const terms=nz(QUERY).split(/\s+/).filter(Boolean);
  const ms=MATCHES.filter(m=>(FILTER==="live"?m.live:FILTER==="done"?m.done:FILTER==="next"?(!m.live&&!m.done):true)&&(!terms.length||terms.every(t=>nz(m.home+" "+m.away+" "+m.comp).includes(t))));
  if(!ms.length)return'<div class="card">'+(terms.length?'Aucun match trouvé pour « '+esc(QUERY.trim())+' ». La recherche porte sur les matchs chargés du jour.':'Aucun match dans cette catégorie.')+'</div>';
  const live=ms.filter(m=>m.live),g={},logo={};
  ms.filter(m=>!m.live).forEach(m=>{const k=m.comp||"Autres";(g[k]=g[k]||[]).push(m);if(m.cl)logo[k]=m.cl});
  const keys=Object.keys(g).sort((a,b)=>(PRIO.test(a)?0:1)-(PRIO.test(b)?0:1));
  const ord=live.concat(...keys.map(k=>g[k])),vis=new Set(ord.slice(0,LIM));
  let h="";
  const lv=live.filter(m=>vis.has(m));
  if(lv.length)h+='<p class="sx-h rd"><i class="sx-dot"></i>En direct ('+live.length+')</p>'+lv.map(m=>mrow(m)).join("");
  keys.forEach(k=>{const a=g[k].filter(m=>vis.has(m));if(a.length)h+='<div class="sx-cmp">'+lg(logo[k],"lgo sm")+'<span>'+esc(k)+'</span></div>'+a.map(m=>mrow(m)).join("")});
  if(ord.length>LIM)h+='<button type="button" id="moreM" class="more sx-more">Voir plus de matchs ('+(ord.length-LIM)+' restants)</button>';
  return h}
async function show(silent){clearInterval(TIMER);
  const parts=(location.hash.slice(1)||"matches").split("/"),p=parts[0],args=parts.slice(1).map(decodeURIComponent);
  const tab={match:"matches",team:"matches",player:"scorers"}[p]||p;
  document.querySelectorAll("#tabs a").forEach(a=>{const on=a.getAttribute("href")==="#"+tab;a.classList.toggle("on",on);if(on&&!silent&&a.scrollIntoView)a.scrollIntoView({block:"nearest",inline:"center"})});
  if(!silent)$("v").innerHTML='<p class="sub">Chargement…</p>';
  try{const f=P[p]||P.matches,h=await f(...args);
    if(!(silent&&document.activeElement&&document.activeElement.id==="sq")){$("v").innerHTML=h;chips();dbg()}
    if(p==="matches")TIMER=setInterval(()=>{if(!document.hidden)show(true)},60000)}
  catch(e){dbg();if(!silent)$("v").innerHTML=err(e);chips()}}
function dbg(){if(!DEBUG)return;$("dbg").hidden=false;const l=SS.last;
  $("dbgp").textContent=l?"GET "+l.path+(l.keyed?"  (avec clé)":"  (sans clé)")+"\nStatut HTTP : "+l.status+"\n\n"+l.body:"Aucune requête effectuée."}

document.addEventListener("click",e=>{
  if(e.target.closest("#moreM")){LIM+=50;const l=$("mlist");if(l)l.innerHTML=mlist();return}
  const tb=e.target.closest("[data-trk]");if(tb){const t=tb.closest(".sx-trk"),f=t.classList.toggle("full");tb.textContent=f?"Réduire":"Agrandir";return}
  const g=e.target.closest("[data-go]");if(g){location.hash=g.dataset.go;return}
  const c=e.target.closest("[data-c]");if(c){COMP=c.dataset.c;show();return}
  const f=e.target.closest("[data-f]");if(f){FILTER=f.dataset.f;LIM=50;show(true);return}
  const m=e.target.closest("[data-m]");if(m){MODE=m.dataset.m;show()}});
document.addEventListener("input",e=>{if(e.target&&e.target.id==="sq"){QUERY=e.target.value;LIM=50;const l=$("mlist");if(l)l.innerHTML=mlist()}});
addEventListener("hashchange",()=>{window.scrollTo(0,0);show()});
(async()=>{const{data:{session}}=await sb.auth.getSession();if(!session)return location.href="auth.html#login";show()})();
</script><script src="pwa.js" defer></script></body></html>

<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><img src="icons/icon-192.png" alt="" width="34" height="34"><span>PRONOST<b>BET</b></span><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#130F33"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Hanken+Grotesk:wght@400;500;700&display=swap"><link rel="stylesheet" href="style.css"><style>.ab{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.ab .btn{width:auto;flex:1;min-width:140px}.fld{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}.bigv{font:800 26px/1 "Bricolage Grotesque",sans-serif}.pos{color:#0B6B33}.neg{color:#B42318}</style><link rel="stylesheet" href="theme.css"><title>Utilisateur – Administration – PronostBet</title></head><body><div class="wrap">
<header class="top"><a class="logo" href="index.html"><img src="icons/icon-192.png" alt="" width="34" height="34"><span>PRONOST<b>BET</b></span></a></header>
<a class="back" href="admin-utilisateurs.html">← Retour aux utilisateurs</a>
<div id="box"><p class="sub">Chargement de l’utilisateur…</p></div>
<div style="height:40px"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script src="config.js"></script><script>
const $=i=>document.getElementById(i),sb=supabase.createClient(CFG.url,CFG.key);
</script><script src="admin-menu.js"></script><script>
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=s=>s?new Date(s).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}):"—";
const dtm=s=>s?new Date(s).toLocaleString("fr-FR",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"}):"Jamais";
const F=n=>Number(n||0).toLocaleString("fr-FR")+" F";
const KD={referral_reward:"Parrainage",withdrawal:"Retrait",withdrawal_refund:"Retrait recrédité",adjustment:"Ajustement"};
const id=new URLSearchParams(location.search).get("id")||"";
const isActive=s=>s.status==="active"&&(!s.ends_at||new Date(s.ends_at)>Date.now());
const ST={active:"Actif",canceled:"Annulé",expired:"Expiré"};
let U=null,W=null;
const line=(k,v)=>'<div class="kv"><span>'+k+'</span><b>'+v+'</b></div>';
function walletBox(){
  if(!W)return '<div class="sec"><h2>Parrainage et solde</h2><p class="note">Données du portefeuille indisponibles.</p></div>';
  const tx=(W.tx||[]).map(x=>'<div class="kv"><span>'+esc(KD[x.kind]||x.kind)+' · '+dt(x.created_at)+(x.note?'<br><small>'+esc(x.note)+'</small>':"")+'</span><b class="'+(x.amount>=0?"pos":"neg")+'">'+(x.amount>=0?"+":"−")+F(Math.abs(x.amount))+'</b></div>').join("");
  return '<div class="sec"><h2>Parrainage et solde</h2>'
    +line("Code de parrainage",esc(W.code||"—"))+line("Parrainé par",W.referrer?esc(W.referrer):"—")
    +line("Filleuls inscrits",W.referred)+line("Filleuls VIP (500 F)",W.rewarded)
    +line("Total gagné",F(W.earned))+line("Total retiré (payé)",F(W.withdrawn))+line("Retraits en cours",F(W.in_progress))
    +'<div class="kv"><span>Solde actuel</span><b class="bigv">'+F(W.balance)+'</b></div>'
    +'<h3 class="hh">Ajouter ou retirer de l’argent</h3>'
    +'<label for="aw">Montant (F CFA)</label><input class="fld" id="aw" type="text" inputmode="numeric" maxlength="7" placeholder="500">'
    +'<label for="an">Motif (facultatif)</label><input class="fld" id="an" type="text" maxlength="100" placeholder="Ex. : bonus, correction…">'
    +'<div class="ab"><button type="button" class="btn" id="bAdd">Ajouter au solde (gain)</button><button type="button" class="btn danger" id="bTake">Retirer du solde</button></div>'
    +'<div id="wmsg" class="pfm" role="status"></div>'
    +(tx?'<h3 class="hh">Derniers mouvements</h3>'+tx:"")+'</div>'}
function draw(){
  const u=U,subs=u.subscriptions||[],act=subs.find(isActive),name=u.full_name?esc(u.full_name):'<i class="nn">Non renseigné</i>';
  const canBlock=!u.is_admin;
  $("box").innerHTML=''
  +'<div class="sec"><h2>'+(u.full_name?esc(u.full_name):esc(u.email))+'</h2><div class="ub" style="margin:6px 0 4px">'
    +(u.is_admin?'<span class="bd in">Administrateur</span>':"")+(u.blocked?'<span class="bd ko">Bloqué</span>':'<span class="bd ok">Compte actif</span>')
    +(act||u.is_admin?'<span class="bd ok">VIP</span>':'<span class="bd mu">Sans VIP</span>')+(u.sub_suspended_at?'<span class="bd ko">VIP suspendu</span>':'')+((u.plan_cap||u.quota_solid!=null||u.quota_uncertain!=null)?'<span class="bd in">Limité</span>':'')+'</div>'
    +line("Nom complet",name)+line("Adresse e-mail",esc(u.email))
    +line("E-mail confirmé",u.email_confirmed?"Oui":"Non")
    +line("Inscrit le",dt(u.created_at))+line("Dernière connexion",dtm(u.last_sign_in_at))
    +line("Conditions acceptées le",dt(u.accepted_terms_at))
    +(u.blocked?line("Bloqué depuis le",dt(u.blocked_at)):"")+'</div>'
  +'<div class="sec"><h2>VIP</h2>'
    +(u.is_admin?'<p class="note">Administrateur : accès toujours actif.</p>':"")
    +(act?line("Formule",esc(act.plan))+line("Depuis le",dt(act.started_at))+line("Fin prévue",act.ends_at?dt(act.ends_at):"Sans date de fin"):(u.is_admin?"":'<p class="note">Aucun VIP actif.</p>'))
    +(subs.length?'<h3 class="hh">Historique</h3>'+subs.map(s=>'<div class="kv"><span>'+esc(s.plan)+' · depuis le '+dt(s.started_at)+(s.canceled_at?' · annulé le '+dt(s.canceled_at):"")+'</span><b>'+esc(ST[s.status]||s.status)+'</b></div>').join(""):"")
    +'</div>'
  +'<div class="sec"><h2>Suspendre ou limiter le VIP</h2>'
    +(u.is_admin?'<p class="note">Administrateur : ne peut être ni suspendu ni limité.</p>':
      (u.sub_suspended_at
        ?'<div class="ab-act tr">⏸ VIP suspendu depuis le <b>'+dt(u.sub_suspended_at)+'</b>'+(u.sub_suspend_note?'<br><small>Motif : '+esc(u.sub_suspend_note)+'</small>':"")+'</div>'
          +'<p class="note">Le compte reste actif mais fonctionne comme un plan Gratuit (parrainage et retraits coupés aussi).</p>'
          +'<div class="ab"><button type="button" class="btn" id="bResume">Réactiver le VIP</button></div>'
        :'<p class="note">Le compte reste actif mais passe au plan Gratuit tant que le VIP est suspendu. La date de fin du VIP ne bouge pas, sauf si tu choisis de la rallonger à la réactivation.</p>'
          +'<label for="sn">Motif (facultatif)</label><input class="fld" id="sn" type="text" maxlength="200" placeholder="Ex. : litige de paiement, abus…">'
          +'<div class="ab"><button type="button" class="btn danger" id="bSusp">Suspendre le VIP</button></div>')
      +'<h3 class="hh">Limiter</h3>'
      +'<label for="lc">Niveau maximum</label><select class="fld" id="lc"><option value="">Aucun plafond</option><option value="basic"'+(u.plan_cap==="basic"?" selected":"")+'>Plafonner à Basic (même avec Gold)</option><option value="free"'+(u.plan_cap==="free"?" selected":"")+'>Plafonner à Gratuit</option></select>'
      +'<label for="lqs">Pronostics solides par jour (vide = selon le plan)</label><input class="fld" id="lqs" type="text" inputmode="numeric" maxlength="3" placeholder="Par défaut" value="'+(u.quota_solid==null?"":u.quota_solid)+'">'
      +'<label for="lqu">Matchs incertains par jour (vide = selon le plan)</label><input class="fld" id="lqu" type="text" inputmode="numeric" maxlength="3" placeholder="Par défaut" value="'+(u.quota_uncertain==null?"":u.quota_uncertain)+'">'
      +'<div class="ab"><button type="button" class="btn" id="bLim">Enregistrer les limites</button></div>'
      +'<p class="note">Les quotas personnalisés ne s’appliquent pas à un compte Gold (accès illimité) : utilise le plafond pour le limiter.</p>')
    +'<div id="smsg" class="pfm" role="status"></div></div>'
  +'<div class="sec"><h2>Donner un VIP</h2>'
    +(u.is_admin?'<p class="note">Administrateur : accès Gold déjà actif, rien à donner.</p>'
    :'<p class="note">Sans paiement. Si la personne a déjà cette formule, la durée s’ajoute à la fin de le VIP en cours.</p>'
    +'<label for="gp">Formule</label><select class="fld" id="gp"><option value="gold">Gold – tous les pronostics</option><option value="basic">Basic – 10 solides et 5 incertains par jour</option></select>'
    +'<label for="gd">Durée (jours)</label><input class="fld" id="gd" type="text" inputmode="numeric" maxlength="3" value="30">'
    +'<div class="ab"><button type="button" class="btn" id="bGrant">Donner le VIP</button></div>'
    +'<div id="gmsg" class="pfm" role="status"></div>')+'</div>'
  +walletBox()
  +'<div class="sec"><h2>Actions</h2>'
    +'<button type="button" class="btn danger" id="bBlock"'+(canBlock?"":" disabled")+'>'+(u.blocked?"Débloquer l’utilisateur":"Bloquer l’utilisateur")+'</button>'
    +(canBlock?"":'<p class="note">Un administrateur ne peut pas être bloqué.</p>')
    +'<button type="button" class="btn ghost" id="bSub"'+(act?"":" disabled")+'>Supprimer le VIP actif</button>'
    +'<div id="amsg" class="pfm" role="status"></div></div>';
  $("bBlock").onclick=toggleBlock;$("bSub").onclick=cancelSub;if($("bGrant"))$("bGrant").onclick=grant;if($("bSusp"))$("bSusp").onclick=suspend;if($("bResume"))$("bResume").onclick=resume;if($("bLim"))$("bLim").onclick=setLimits;
  if($("bAdd")){$("bAdd").onclick=()=>adjust(1);$("bTake").onclick=()=>adjust(-1)}}
const say=(t,ok)=>{const m=$("amsg");if(m){m.textContent=t||"";m.className="pfm"+(t?(ok?" ok":" ko"):"")}};
const wsay=(t,ok)=>{const m=$("wmsg");if(m){m.textContent=t||"";m.className="pfm"+(t?(ok?" ok":" ko"):"")}};
const who=()=>U.full_name||U.email;
const gsay=(t,ok)=>{const m=$("gmsg");if(m){m.textContent=t||"";m.className="pfm"+(t?(ok?" ok":" ko"):"")}};
async function grant(){
  const plan=$("gp").value,label=plan==="gold"?"Gold":"Basic",days=parseInt(($("gd").value||"").replace(/\D/g,""),10);
  if(!days||days<1||days>366)return gsay("Durée : entre 1 et 366 jours.");
  if(!confirm("Donner le VIP "+label+" pour "+days+" jour"+(days>1?"s":"")+" à "+who()+" ?\nAucun paiement ne sera demandé."))return;
  $("bGrant").disabled=true;
  const{data,error}=await sb.rpc("admin_grant_subscription",{uid:id,p_plan:plan,p_days:days});
  if(error){$("bGrant").disabled=false;return gsay("Action impossible : "+error.message)}
  await load();gsay("VIP "+label+" activé jusqu’au "+dt(data&&data.ends_at)+".",true)}
async function adjust(sign){
  const n=parseInt(($("aw").value||"").replace(/\D/g,""),10),note=$("an").value.trim();
  if(!n)return wsay("Saisis un montant.");
  if(!confirm((sign>0?"Ajouter ":"Retirer ")+F(n)+(sign>0?" au solde de ":" du solde de ")+who()+" ?"))return;
  $("bAdd").disabled=$("bTake").disabled=true;
  const{data,error}=await sb.rpc("admin_adjust_wallet",{uid:id,p_amount:sign*n,p_note:note});
  if(error){$("bAdd").disabled=$("bTake").disabled=false;return wsay(error.message)}
  await load();wsay("Solde mis à jour : "+F(data)+".",true)}
const ssay=(t,ok)=>{const m=$("smsg");if(m){m.textContent=t||"";m.className="pfm"+(t?(ok?" ok":" ko"):"")}};
async function suspend(){
  const note=($("sn").value||"").trim();
  if(!confirm("Suspendre le VIP de "+who()+" ?\nLe compte passera au plan Gratuit jusqu'à la réactivation."))return;
  $("bSusp").disabled=true;
  const{error}=await sb.rpc("admin_set_sub_suspended",{uid:id,b:true,p_note:note,p_extend:false});
  if(error){$("bSusp").disabled=false;return ssay("Action impossible : "+error.message)}
  await load();ssay("VIP suspendu.",true)}
async function resume(){
  if(!confirm("Réactiver le VIP de "+who()+" ?"))return;
  const ext=confirm("Rallonger la fin du VIP de la durée de la suspension ?\nOK = oui, Annuler = non (la date de fin reste la même).");
  $("bResume").disabled=true;
  const{data,error}=await sb.rpc("admin_set_sub_suspended",{uid:id,b:false,p_note:null,p_extend:ext});
  if(error){$("bResume").disabled=false;return ssay("Action impossible : "+error.message)}
  await load();ssay("VIP réactivé"+(ext&&data&&data.extended?" et durée rallongée.":"."),true)}
async function setLimits(){
  const q=el=>{const v=($(el).value||"").trim();if(v==="")return null;if(!/^\d{1,3}$/.test(v)||+v>100)return NaN;return +v};
  const qs=q("lqs"),qu=q("lqu"),cap=$("lc").value||null;
  if(Number.isNaN(qs)||Number.isNaN(qu))return ssay("Quotas : un nombre entre 0 et 100, ou vide.");
  if(!confirm("Enregistrer ces limites pour "+who()+" ?"))return;
  $("bLim").disabled=true;
  const{error}=await sb.rpc("admin_set_limits",{uid:id,p_cap:cap,p_solid:qs,p_uncertain:qu});
  if(error){$("bLim").disabled=false;return ssay("Action impossible : "+error.message)}
  await load();ssay("Limites enregistrées.",true)}
async function toggleBlock(){
  const b=!U.blocked;
  if(!confirm((b?"Bloquer ":"Débloquer ")+who()+" ?\n"+(b?"Cette personne sera déconnectée et ne pourra plus utiliser PronostBet.":"Cette personne pourra de nouveau se connecter.")))return;
  $("bBlock").disabled=true;
  const{error}=await sb.rpc("admin_set_blocked",{uid:id,b});
  if(error){say("Action impossible : "+error.message);$("bBlock").disabled=false;return}
  await load();say(b?"Utilisateur bloqué.":"Utilisateur débloqué.",true)}
async function cancelSub(){
  if(!confirm("Supprimer le VIP actif de "+who()+" ?\nLe VIP sera marqué comme annulé."))return;
  $("bSub").disabled=true;
  const{data,error}=await sb.rpc("admin_cancel_subscription",{uid:id});
  if(error){say("Action impossible : "+error.message);$("bSub").disabled=false;return}
  await load();say(data>0?"VIP actif supprimé.":"Aucun VIP actif à supprimer.",data>0)}
async function load(){
  const[a,w]=await Promise.all([sb.rpc("admin_user",{uid:id}),sb.rpc("admin_wallet",{uid:id})]);
  const{data,error}=a;
  if(error){if(error.code==="42501"){location.href="dashboard.html";return}$("box").innerHTML='<div class="card">Utilisateur indisponible : '+esc(error.message)+'</div>';return}
  if(!data){$("box").innerHTML='<div class="card">Utilisateur introuvable.</div>';return}
  U=data;W=w.error?null:w.data;draw()}
(async()=>{const{data:{session}}=await sb.auth.getSession();if(!session)return location.href="auth.html#login";
  if(!/^[0-9a-f-]{36}$/i.test(id)){$("box").innerHTML='<div class="card">Utilisateur introuvable.</div>';return}
  const{data:adm}=await sb.rpc("is_admin");if(!adm)return location.href="dashboard.html";
  load()})();
</script></body></html>

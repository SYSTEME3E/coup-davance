<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#130F33"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PronostBet"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Hanken+Grotesk:wght@400;500;700&display=swap"><link rel="stylesheet" href="style.css">
<style>
[hidden]{display:none!important}
.code{font:800 34px/1 "Bricolage Grotesque",sans-serif;letter-spacing:.14em;text-align:center;padding:18px 10px;margin:12px 0;background:var(--bg);border:1px dashed var(--brand);border-radius:12px;overflow-wrap:anywhere}
.code.blur{filter:blur(9px);user-select:none;pointer-events:none}
.lock{position:relative}
.lock .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;text-align:center;padding:0 12px}
.row2{display:flex;gap:8px;flex-wrap:wrap}.row2 .btn{flex:1;min-width:140px;width:auto}
.bal{font:800 46px/1.05 "Bricolage Grotesque",sans-serif;margin:6px 0 2px}
select,input.fld{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.ph{display:flex;gap:8px;align-items:center}.ph span{padding:12px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:700;white-space:nowrap}
.alln{background:none;border:0;padding:0;color:var(--brand);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
#wm{margin:0 0 8px;font-size:15px;font-weight:700}#wm.ok{color:#0B6B33}#wm.ko{color:#B42318}
.hr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.hr:first-of-type{border-top:0}.hr small{display:block;color:var(--muted);font-size:13px}
.hr b{white-space:nowrap}.hr .pos{color:#0B6B33}.hr .neg{color:#B42318}
#wb,#wb:disabled:hover{background:#D93B3B;color:#fff}#wb:hover{background:#B42318}
.lk2{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font:700 13px "Hanken Grotesk",sans-serif;cursor:pointer;color:var(--ink);margin-top:6px}
</style><link rel="stylesheet" href="theme.css"><title>Retrait – PronostBet</title></head><body><div class="wrap">
<header class="top"><a class="logo" href="index.html"><img src="icons/icon-192.png" alt="" width="34" height="34"><span>PRONOST<b>BET</b></span></a></header>
<h1 class="pt">Retirer mes gains</h1><p class="sub" style="text-transform:none"><a href="balance.html">← Mon solde</a></p>
<div id="wm" role="status"></div>
<div id="app"><p class="sub">Chargement…</p></div>
<div style="height:40px"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script src="config.js"></script><script src="i18n.js"></script><script>
const $=i=>document.getElementById(i),sb=supabase.createClient(CFG.url,CFG.key);
</script><script src="menu.js"></script><script>
const t=PB.t,F=PB.fmt;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=s=>s?new Date(s).toLocaleDateString(PB.loc(),{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
const ST={pending:["in","En attente"],processing:["in","En cours"],manual:["in","En traitement"],paid:["ok","Payé"],failed:["ko","Échoué"],canceled:["mu","Annulé"]};
const KD={referral_reward:"Parrainage",withdrawal:"Retrait",withdrawal_refund:"Retrait recrédité",adjustment:"Ajustement"};
const SHOW=4,STEP=10;
const moreBtn=(id,shown,total)=>shown<total?'<button type="button" class="more" id="'+id+'" style="display:block;width:100%;margin-top:10px">'+t("Voir plus")+'</button>':"";
let NETS=[],NMAP={},R=null,WD=[],TX=[],busy=false,RATE=0,swd=SHOW,stx=SHOW;
const say=(m,ok)=>{const e=$("wm");if(e){e.textContent=m?t(m):"";e.className=m?(ok?"ok":"ko"):""}};
async function api(path,body){const{data:{session}}=await sb.auth.getSession();if(!session)throw new Error("session");
  const fn={"/api/withdraw":"withdraw","/api/sync":"withdraw-sync"}[path];if(!fn)throw new Error("route");
  const r=await fetch(CFG.url+"/functions/v1/"+fn,{method:"POST",headers:{"Content-Type":"application/json",apikey:CFG.key,Authorization:"Bearer "+session.access_token},body:JSON.stringify(body||{})});
  return r.json().catch(()=>({ok:false}))}

const METHODS=[["mobile","Mobile Money"],["usdt","USDT (TRC20)"],["bank","Virement bancaire"]];
const FEEP=0.10,MINM=1000,MINUSD={usdt:10,bank:20};
const minF=m=>MINUSD[m]&&RATE?Math.max(MINM,Math.ceil(MINUSD[m]*RATE)):MINM;
const minTxt=m=>MINUSD[m]?(PB.cur()==="USD"||!RATE?t("Minimum : {0}",MINUSD[m]+" $"):t("Minimum : {0} (environ {1})",MINUSD[m]+" $",F(minF(m)))):t("Minimum : {0}",F(MINM));
const hasMob=c=>NETS.some(x=>x.country_code===c);
const isManual=()=>{if($("wm2").value!=="mobile")return true;const x=NMAP[$("wc").value+"|"+$("wn").value];return !!(x&&x.manual)};
// Montant saisi (devise de l'utilisateur) -> F CFA ; "tout retirer" et les arrondis retombent exactement sur le solde
const baseAmt=()=>{const v=PB.parse($("wa").value);if(!v)return 0;let b=PB.toBase(v);if(R&&Math.abs(b-R.balance)<=Math.max(2,R.balance*0.005))b=R.balance;return b};
async function load(){
  const[a,n,w,fx]=await Promise.all([sb.rpc("my_referral"),
    sb.from("payout_networks").select("country_code,country_name,dial,network,label,manual").eq("enabled",true),
    sb.from("withdrawals").select("*").order("created_at",{ascending:false}).limit(40),
    sb.from("usd_rates").select("currency,per_usd")]);
  PB.setRates(fx&&fx.data);const x=((fx&&fx.data)||[]).find(r=>r.currency==="XOF");RATE=x?Number(x.per_usd)||0:0;
  if(a.error){$("app").innerHTML='<div class="card">Impossible de charger tes gains pour le moment. Réessaie dans un instant.</div>';return false}
  R=a.data;NETS=n.data||[];WD=w.data||[];NMAP={};NETS.forEach(x=>NMAP[x.country_code+"|"+x.network]=x);return true}
function balBox(){return '<div class="sec"><h2>Mon solde</h2><div class="bal">'+F(R.balance)+'</div></div>'}
function formCard(){
  const active=WD.find(w=>w.status==="pending"||w.status==="processing"||w.status==="manual");
  const all=PB.countries();
  let off="";
  if(active)off=t("Un retrait est déjà en cours de traitement. Tu pourras en demander un autre dès qu’il sera terminé.");
  else if(R.balance<R.min_withdrawal)off=t("Il te faut au moins {0} pour retirer. Il te manque {1}.",F(R.min_withdrawal),F(R.min_withdrawal-R.balance));
  const inp=(id,lab,ph,extra)=>'<label for="'+id+'">'+lab+'</label><input class="fld" id="'+id+'" type="text" placeholder="'+ph+'" '+(extra||"")+'>';
  return '<div class="sec"><h2>Retirer mes gains</h2>'+(off?'<p class="note">'+esc(off)+'</p>':"")
   +'<form id="wf" novalidate'+(off?' hidden':"")+'>'
   +'<label for="wc">Pays</label><select id="wc"><option value="">Choisis ton pays</option>'+all.map(c=>'<option value="'+esc(c[0])+'"'+(c[0]===PB.country()?" selected":"")+'>'+esc(c[1])+'</option>').join("")+'</select>'
   +'<label for="wm2">Moyen de retrait</label><select id="wm2"></select><p class="note" id="wnote"></p>'
   +'<div id="g-mobile"><label for="wn">Réseau</label><select id="wn"></select>'
   +'<label for="wp">Numéro Mobile Money</label><div class="ph"><span id="wd"></span><input class="fld" id="wp" type="text" inputmode="numeric" autocomplete="tel-national" maxlength="14" placeholder="Numéro sans l’indicatif"></div></div>'
   +'<div id="g-bank" hidden>'
   +inp("bk-n","Nom de la banque","Ex : Ecobank",'maxlength="80"')
   +inp("bk-h","Nom du destinataire","Ex : Jean Dupont",'maxlength="80" autocomplete="name"')
   +inp("bk-a","Numéro de compte ou IBAN","Ex : GB33BUKB20201555555555",'maxlength="40" autocapitalize="characters" autocomplete="off"')
   +inp("bk-s","Code SWIFT (facultatif)","Ex : BOFAUS3N",'maxlength="11" autocapitalize="characters" autocomplete="off"')
   +'<p class="note" style="margin:16px 0 0"><b>Adresse du destinataire</b></p>'
   +inp("bk-st","Nom de rue","Ex : Rue des Maquis",'maxlength="80"')
   +inp("bk-no","Numéro de rue","Ex : 4",'maxlength="10"')
   +inp("bk-ci","Ville","Ex : Abidjan",'maxlength="60"')
   +inp("bk-po","Code postal","Ex : 00225",'maxlength="12"')+'</div>'
   +'<div id="g-usdt" hidden>'+inp("us-a","Adresse USDT (réseau TRC20 uniquement)","Adresse commençant par T",'maxlength="40" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"')
   +'<p class="note">Réseau TRC20 uniquement : un envoi sur un autre réseau ferait perdre les fonds.</p></div>'
   +'<label for="wa" id="wal">'+t("Montant ({0})",PB.sym())+'</label><input class="fld" id="wa" type="text" inputmode="decimal" maxlength="14" value="">'
   +'<p class="note" id="fee"></p>'
   +'<p class="note" id="hint"></p>'
   +'<button class="btn danger" id="wb" type="submit" style="margin-top:14px">Retirer</button></form></div>'}
function wireForm(){
  const syncNet=()=>{const c=$("wc").value,l=NETS.filter(x=>x.country_code===c);
    $("wn").innerHTML=l.map(x=>'<option value="'+esc(x.network)+'">'+esc(x.label)+'</option>').join("");
    $("wd").textContent="+"+(l[0]?l[0].dial:"")};
  const setMeth=()=>{const c=$("wc").value,old=$("wm2").value;
    const l=c?(hasMob(c)?METHODS:METHODS.filter(m=>m[0]!=="mobile")):[];
    $("wm2").innerHTML=l.length?l.map(m=>'<option value="'+m[0]+'">'+t(m[1])+'</option>').join(""):'<option value="">'+t("Choisis d’abord ton pays")+'</option>';
    if(l.some(m=>m[0]===old))$("wm2").value=old;
    $("wnote").textContent=c&&!hasMob(c)?t("Le Mobile Money n’est pas disponible dans ce pays : retire par USDT (TRC20) ou par virement bancaire."):""};
  const upd=()=>{const m=$("wm2").value;
    ["mobile","bank","usdt"].forEach(k=>{$("g-"+k).hidden=k!==m});
    const man=isManual(),a=baseAmt();
    if(man){const fee=Math.ceil(a*FEEP);
      $("fee").textContent=a?t("Frais de 10 % : − {0} · Tu reçois : {1} · {2}",F(fee),F(Math.max(0,a-fee)),minTxt(m)):t("Frais de 10 % sur ce type de retrait · {0}",minTxt(m))}
    else $("fee").textContent="";
    $("hint").textContent=man?t("Retrait traité manuellement par notre équipe : tu es payé après vérification."):""};
  $("wc").onchange=()=>{setMeth();syncNet();upd()};$("wn").onchange=upd;$("wm2").onchange=upd;$("wa").oninput=upd;
  $("wf").onsubmit=submit;setMeth();syncNet();upd()}
function histCard(){
  const lab=x=>x.method==="bank"?t("Virement")+(x.details&&x.details.bank_name?" · "+x.details.bank_name:""):x.method==="usdt"?"USDT TRC20":(NMAP[x.country+"|"+x.network]?NMAP[x.country+"|"+x.network].label:x.network);
  const tail=x=>x.method==="bank"?"••• "+String(x.details&&x.details.account||"").slice(-4):x.method==="usdt"?"••• "+String(x.details&&x.details.address||"").slice(-4):"••• "+String(x.phone).slice(-3);
  const l=WD.slice(0,swd);
  const w=l.length?l.map(x=>{const s=ST[x.status]||["mu",x.status];
    return '<div class="hr"><div><b>'+F(x.amount)+'</b> · '+esc(lab(x))+'<small>'+dt(x.created_at)+' · '+esc(tail(x))+'</small>'
      +(x.fee>0?'<small>'+t("Frais {0} · tu reçois {1}",F(x.fee),F(x.amount-x.fee))+'</small>':"")
      +(x.status==="failed"&&x.error?'<small>'+esc(x.error)+'</small>':"")
      +((x.status==="pending"||x.status==="manual")?'<button class="lk2" data-c="'+esc(x.id)+'" type="button">Annuler ce retrait</button>':"")+'</div><span class="bd '+s[0]+'">'+t(s[1])+'</span></div>'}).join("")
    :'<p class="note">Aucun retrait pour le moment.</p>';
  return '<div class="sec"><h2>Mes retraits</h2>'+w+moreBtn("mwd",swd,WD.length)+'</div>'}
function draw(){
  const keep=$("wf")&&$("wf").contains(document.activeElement);
  $("app").innerHTML=balBox()+formCard()+histCard();
  if($("wf"))wireForm();
  if($("mwd"))$("mwd").onclick=()=>{swd+=STEP;draw()};
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>cancel(b.dataset.c))}
async function submit(e){e.preventDefault();if(busy)return;say("");
  const m=$("wm2").value,amount=baseAmt(),v=id=>($(id).value||"").trim();
  if(!$("wc").value)return say("Choisis ton pays.");
  if(!m)return say("Choisis un moyen de retrait.");
  if(!amount||amount<1)return say("Saisis un montant valide.");
  if(amount>R.balance)return say("Solde insuffisant.");
  if(MINUSD[m]&&amount<minF(m))return say(t("Le montant minimum pour ce retrait est de {0} (environ {1}).",MINUSD[m]+" $",F(minF(m))));
  let rpc,args,manual=true;
  if(m==="mobile"){const c=$("wc").value,n=$("wn").value,phone=$("wp").value.replace(/\D/g,"");
    if(phone.length<8)return say("Numéro de téléphone invalide.");
    const net=NMAP[c+"|"+n];
    if(net&&net.manual){rpc="request_manual_withdrawal";args={p_amount:amount,p_method:"mobile_manual",p_country:c,p_network:n,p_phone:phone,p_details:null}}
    else{manual=false;rpc="request_withdrawal";args={p_amount:amount,p_country:c,p_network:n,p_phone:phone}}}
  else{rpc="request_manual_withdrawal";
    const base={p_amount:amount,p_method:m,p_country:null,p_network:null,p_phone:null};
    if(m==="bank")args={...base,p_country:$("wc").value,p_details:{bank_name:v("bk-n"),holder:v("bk-h"),account:v("bk-a"),swift:v("bk-s"),street:v("bk-st"),street_no:v("bk-no"),city:v("bk-ci"),postal:v("bk-po")}};
    else if(m==="usdt")args={...base,p_details:{address:v("us-a")}};
    else return say("Moyen de retrait invalide.")}
  busy=true;$("wb").disabled=true;$("wb").textContent=t("Envoi en cours…");
  const{data:wid,error}=await sb.rpc(rpc,args);
  if(error){busy=false;$("wb").disabled=false;$("wb").textContent=t("Retirer");return say(error.message)}
  let res=null;if(!manual){try{res=await api("/api/withdraw",{id:wid})}catch(x){}}
  busy=false;await refresh();
  if(manual)say("Demande envoyée. Notre équipe va la traiter : tu seras payé après vérification.",true);
  else say(res&&res.ok===false?(res.message||"Retrait échoué."):"Demande envoyée. Le paiement arrive sur ton Mobile Money dans quelques instants.",!(res&&res.ok===false))}
async function cancel(id){if(busy||!confirm(t("Annuler ce retrait ? Le montant sera remis sur ton solde.")))return;busy=true;
  const{error}=await sb.rpc("cancel_my_withdrawal",{wid:id});busy=false;await refresh();if(error)say(error.message)}
async function refresh(){if(await load())draw()}
document.addEventListener("pb-country",()=>{if(R&&!busy)draw()});
(async()=>{const{data:{session}}=await sb.auth.getSession();if(!session)return location.href="auth.html#login";
  await PB.sync(sb);if(!await load())return;
  if(WD.some(w=>w.status==="pending"))for(const w of WD.filter(w=>w.status==="pending"))await api("/api/withdraw",{id:w.id}).catch(()=>{});
  if(WD.some(w=>w.status==="processing"))await api("/api/sync").catch(()=>{});
  await load();draw();
  setInterval(async()=>{if(document.hidden||busy||!WD.some(w=>w.status==="processing"))return;await api("/api/sync").catch(()=>{});
    const f=$("wf")&&$("wf").contains(document.activeElement);if(!f)await refresh()},20000);
})();
</script><script src="pwa.js" defer></script></body></html>

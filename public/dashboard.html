<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#130F33"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pronos-bet"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Hanken+Grotesk:wght@400;500;700&display=swap"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="predview.css"><link rel="stylesheet" href="theme.css"><title>Matchs du jour – Pronos-bet</title><style>
.bonus{margin:14px 0}.bonus .btn{background:var(--navy);}

.pt-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}

.pt-code button,.pt-go{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 14px;font:700 15px "Hanken Grotesk",sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.pt-go{display:block;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

</style>
</head><body class="pd"><div class="wrap">
<header class="top"><a class="logo" href="index.html"><img src="icon.svg" alt="" width="34" height="34"><span>Pronos-bet</span></a></header>
<h1 class="pt">Matchs du jour</h1><p class="sub" id="date"></p>
<div id="install" class="inst" hidden><img src="icon.svg" alt="" width="44" height="44"><div><b>Pronos-bet sur ton téléphone</b><span>Installe l’app pour y accéder en un geste.</span></div><button type="button" id="installBtn" class="btn">Installer l’app</button><p id="installHelp" class="note" hidden></p></div>
<section class="bonus" id="bonus"><button type="button" class="btn" id="bonusBtn" aria-expanded="false" aria-controls="bonusList">🎁 Bonus partenaires</button>
<div id="bonusList" hidden></div></section>
<div class="srch"><input id="q" type="search" placeholder="Rechercher une équipe ou une compétition…" autocomplete="off"><input id="qd" type="date" aria-label="Date du match"></div>
<h2 class="pc-h">Prédictions</h2><p class="pc-sub" id="pcn"></p>
<div class="pc-flt" id="pf"><button type="button" data-pf="all" class="on">Tous</button><button type="button" data-pf="live">En direct</button><button type="button" data-pf="next">À venir</button><button type="button" data-pf="done">Terminés</button><button type="button" data-pf="top">80 %+</button></div>
<div id="list"><p class="sub">Chargement des matchs…</p></div>
<p class="note" style="text-align:center;margin:28px 0 8px">Propulsé par <a href="https://kickoffapi.com" target="_blank" rel="noopener">KickoffAPI</a></p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script src="config.js"></script><script>
const $=i=>document.getElementById(i),sb=supabase.createClient(CFG.url,CFG.key);
</script><script src="cards.js"></script><script src="menu.js"></script><script src="sportscore.js"></script><script>
$("date").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
(async()=>{const{data:{session}}=await sb.auth.getSession();if(!session)return location.href="auth.html#login";
let homeHTML="",tok=0,cache=null;
const clean=()=>$("q").value.replace(/[%_,()*\\]/g," ").trim();
const searching=()=>clean().length>=2||!!$("qd").value;
// Liste du jour : matchs en cours en premier (rouge), puis les matchs d’aujourd’hui uniquement. Actualisée toutes les 60 s.
let LIM=30,lastSig="",FILT="all";const COLS="fixture_id,kickoff,league,home,away,data,settled_at,final_home,final_away,final_status,verdict,live_status,live_home,live_away,live_minute,kind,unlocked";
document.addEventListener("click",e=>{if(e.target&&e.target.id==="moreHome"){LIM+=30;build()}});
const PF=m=>FILT==="all"||(FILT==="live"?!!m.live_status:FILT==="next"?(!m.live_status&&!m.settled_at&&new Date(m.kickoff)>Date.now()):(isOpen(m)&&Math.max(m.data.result.home,m.data.result.draw,m.data.result.away)>=80));
const build=()=>{const{all:all0,error,s,tm}=cache;const all=all0.filter(PF);$("pcn").textContent=error?"":all.length+(all.length>1?" affichés":" affiché");
 const liveNow=all.filter(m=>m.live_status),rest=all.filter(m=>!m.live_status);
 let budget=LIM;const take=a=>{const x=a.slice(0,Math.max(0,budget));budget-=x.length;return x};
 const day=d=>rest.filter(m=>new Date(m.kickoff).toDateString()===d.toDateString());
 const part=(t,d,hideEmpty)=>{const a=day(d);if(!a.length&&hideEmpty)return"";return '<p class="sub dh">'+t+' ('+a.length+')</p>'+(a.length?take(a).map(card).join(""):'<div class="card"><p class="sub" style="margin:0">Plus aucun match à venir pour le moment.</p></div>')};
 homeHTML=error?'<div class="card">Impossible de charger les matchs. Réessaie dans un instant.</div>':all0.length&&!all.length?'<div class="card">Aucun match dans cette catégorie pour le moment.</div>':all.length?(liveNow.length?'<p class="sub dh rd">En cours ('+liveNow.length+')</p>'+take(liveNow).map(card).join(""):"")+part("Aujourd’hui",s,liveNow.length>0):'<div class="card"><b>Pas de match avec pronostic pour aujourd’hui pour le moment.</b><p class="sub" style="margin:8px 0 0">Ils sont calculés toutes les 5 minutes. Il peut aussi n’y avoir aucun match dans les compétitions couvertes.</p></div>';
 if(all.length>LIM)homeHTML+='<button id="moreHome" class="more">Afficher plus de matchs ('+(all.length-LIM)+')</button>';
 if(!searching())$("list").innerHTML=homeHTML};
// Direct : SportScore (status=live) fournit le statut et le score ; les pronostics ne changent pas.
// Doublons (même match venu de deux sources) : on n'en affiche qu'un, le plus ancien — la base n'est pas modifiée.
const withSS=async rows=>{
 const asX=m=>({home:m.home,away:m.away,t:+new Date(m.kickoff)}),uniq=[];
 rows.slice().sort((a,b)=>a.fixture_id-b.fixture_id).forEach(m=>{if(!uniq.some(u=>ssSameMatch(asX(m),asX(u),2)))uniq.push(m)});
 const keep=rows.filter(m=>uniq.includes(m));
 let live=[];try{live=await ssLive()}catch(e){}
 keep.forEach(m=>{const l=live.find(v=>ssSameMatch(asX(m),{home:v.home,away:v.away,t:v.start?+new Date(v.start):0},3));
  if(!l)return;
  m.live_status=/half[- ]?time|\bht\b/.test(l.status)?"HT":(m.live_status&&m.live_status!=="HT"?m.live_status:"LIVE");
  if(l.hs!=null&&l.as!=null){m.live_home=l.hs;m.live_away=l.as}});
 return keep};
const loadHome=async first=>{
 const s=new Date();s.setHours(0,0,0,0);
 const yd=new Date(s);yd.setDate(yd.getDate()-1);const tm=new Date(s);tm.setDate(tm.getDate()+1);const e=new Date(s);e.setDate(e.getDate()+2);
 const{data,error}=await sb.from("predictions_safe").select(COLS).gte("kickoff",yd.toISOString()).lt("kickoff",tm.toISOString()).is("settled_at",null).order("kickoff");
 if(error&&!first)return;
 let all=(data||[]).filter(m=>m.live_status||(new Date(m.kickoff).toDateString()===s.toDateString()&&new Date(m.kickoff).getTime()>Date.now()-3*36e5));
 all=await withSS(all);
 const sig=s.toDateString()+JSON.stringify(all.map(m=>[m.fixture_id,m.live_status,m.live_home,m.live_away,m.live_minute]));
 if(!first&&!error&&sig===lastSig)return; // rien n'a changé : on ne redessine pas la liste
 lastSig=sig;cache={all,error,s,tm};build();
 ensureLogos(all.slice(0,60),build)};
$("pf").onclick=e=>{const b=e.target.closest("[data-pf]");if(!b)return;if(b.dataset.pf==="done"){location.href="historique.html";return}
 FILT=b.dataset.pf;LIM=30;$("pf").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));if(cache)build()};
await loadHome(true);
setInterval(()=>{if(!document.hidden)loadHome(false)},60000);
const render=(t,a)=>a.length?'<p class="sub dh">'+t+' ('+a.length+')</p>'+a.map(card).join(""):"";
const doSearch=async()=>{const my=++tok,q=clean(),dv=$("qd").value;
 if(q.length<2&&!dv){$("list").innerHTML=homeHTML;return}
 const s=new Date();s.setHours(0,0,0,0);
 let a=sb.from("predictions_safe").select(COLS).order("kickoff",{ascending:false}).limit(60);
 if(q.length>=2)a=a.or("home.ilike.%"+q+"%,away.ilike.%"+q+"%,league.ilike.%"+q+"%");
 if(dv){const d0=new Date(dv+"T00:00:00"),d1=new Date(d0);d1.setDate(d1.getDate()+1);a=a.gte("kickoff",d0.toISOString()).lt("kickoff",d1.toISOString())}
 const{data:r,error:er}=await a;if(my!==tok)return;
 if(er){$("list").innerHTML='<div class="card">Recherche impossible pour le moment. Réessaie dans un instant.</div>';return}
 const up=(r||[]).filter(m=>new Date(m.kickoff)>=s).reverse(),past=(r||[]).filter(m=>new Date(m.kickoff)<s);
 const html=()=>(up.length||past.length)?render("À venir",up)+render("Déjà joués",past):'<div class="card"><b>Aucun match trouvé.</b><p class="sub" style="margin:8px 0 0">Essaie un autre nom d’équipe, de compétition ou une autre date.</p></div>';
 $("list").innerHTML=html();
 ensureLogos(r||[],()=>{if(my===tok)$("list").innerHTML=html()})};
let tm_;$("q").oninput=()=>{clearTimeout(tm_);tm_=setTimeout(doSearch,300)};$("qd").onchange=doSearch;
})();
</script><script src="pwa.js" defer></script><script>

 var h='<p class="note">Crée ton compte chez un partenaire avec notre code promo pour profiter de son bonus de bienvenue.</p>';

 });
 h+='<div class="pt-group"><p class="note"><b>Après ton inscription</b>, rejoins notre groupe pour recevoir des pronostics gratuits.</p>'
  +(GROUP_URL?'<a class="pt-go" href="'+GROUP_URL+'" target="_blank" rel="noopener">Rejoindre le groupe</a>':'<p class="note">Le lien du groupe arrive bientôt.</p>')+'</div>'
  +'<p class="note">Liens partenaires : nous touchons une commission si tu t’inscris, sans frais pour toi. Réservé aux 18 ans et plus. Les paris comportent des risques : joue avec modération et vérifie que les paris en ligne sont autorisés dans ton pays. Bonus soumis à conditions.</p>';
 box.innerHTML=h;
 btn.onclick=function(){var open=box.hidden;box.hidden=!open;btn.setAttribute("aria-expanded",open?"true":"false");btn.textContent=open?"🎁 Masquer les bonus":"🎁 Bonus partenaires"};
 box.addEventListener("click",function(e){var g=e.target.closest("[data-pc]");if(g){var code=PARTNERS[+g.dataset.pc].code,h=g.nextElementSibling;
   try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code)}catch(x){}

  var b=e.target.closest("[data-copy]");if(!b)return;var c=PARTNERS[+b.dataset.copy].code;
  var done=function(){b.textContent="Copié ✓";setTimeout(function(){b.textContent="Copier"},1800)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(c).then(done,function(){});
  else{var t=document.createElement("textarea");t.value=c;document.body.appendChild(t);t.select();try{document.execCommand("copy");done()}catch(x){}t.remove()}});

<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1D6FD8"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pronos-bet"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Hanken+Grotesk:wght@400;500;700&display=swap"><link rel="stylesheet" href="style.css"><title>Matchs du jour – Pronos-bet</title></head><body><div class="wrap">
<header class="top"><a class="logo" href="index.html"><img src="icon.svg" alt="" width="34" height="34"><span>Pronos-bet</span></a></header>
<h1 class="pt">Matchs du jour</h1><p class="sub" id="date"></p>
<div id="install" class="inst" hidden><img src="icon.svg" alt="" width="44" height="44"><div><b>Pronos-bet sur ton téléphone</b><span>Installe l’app pour y accéder en un geste.</span></div><button type="button" id="installBtn" class="btn">Installer l’app</button><p id="installHelp" class="note" hidden></p></div>
<div class="srch"><input id="q" type="search" placeholder="Rechercher une équipe ou une compétition…" autocomplete="off"><input id="qd" type="date" aria-label="Date du match"></div>
<div id="list"><p class="sub">Chargement des matchs…</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script src="config.js"></script><script>
const $=i=>document.getElementById(i),sb=supabase.createClient(CFG.url,CFG.key);
</script><script src="cards.js"></script><script src="menu.js"></script><script>
$("date").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
(async()=>{const{data:{session}}=await sb.auth.getSession();if(!session)return location.href="auth.html#login";
let homeHTML="",tok=0,cache=null;
const clean=()=>$("q").value.replace(/[%_,()*\\]/g," ").trim();
const searching=()=>clean().length>=2||!!$("qd").value;
// Liste du jour : matchs en cours en premier (rouge), puis aujourd’hui et demain. Actualisée toutes les 60 s.
let LIM=30,lastSig="";const COLS="fixture_id,kickoff,league,home,away,data,settled_at,final_home,final_away,final_status,verdict,live_status,live_home,live_away,live_minute";
document.addEventListener("click",e=>{if(e.target&&e.target.id==="moreHome"){LIM+=30;build()}});
const build=()=>{const{all,error,s,tm}=cache;
 const liveNow=all.filter(m=>m.live_status),rest=all.filter(m=>!m.live_status);
 let budget=LIM;const take=a=>{const x=a.slice(0,Math.max(0,budget));budget-=x.length;return x};
 const day=d=>rest.filter(m=>new Date(m.kickoff).toDateString()===d.toDateString());
 const part=(t,d,hideEmpty)=>{const a=day(d);if(!a.length&&hideEmpty)return"";return '<p class="sub dh">'+t+' ('+a.length+')</p>'+(a.length?take(a).map(card).join(""):'<div class="card"><p class="sub" style="margin:0">Plus aucun match à venir pour le moment.</p></div>')};
 homeHTML=error?'<div class="card">Impossible de charger les matchs. Réessaie dans un instant.</div>':all.length?(liveNow.length?'<p class="sub dh rd">En cours ('+liveNow.length+')</p>'+take(liveNow).map(card).join(""):"")+part("Aujourd’hui",s,liveNow.length>0)+part("Demain",tm):'<div class="card"><b>Pas encore de pronostics pour aujourd’hui ni demain.</b><p class="sub" style="margin:8px 0 0">Ils sont calculés toutes les 5 minutes. Il peut aussi n’y avoir aucun match dans les compétitions couvertes.</p></div>';
 if(all.length>LIM)homeHTML+='<button id="moreHome" class="more">Afficher plus de matchs ('+(all.length-LIM)+')</button>';
 if(!searching())$("list").innerHTML=homeHTML};
const loadHome=async first=>{
 const s=new Date();s.setHours(0,0,0,0);
 const yd=new Date(s);yd.setDate(yd.getDate()-1);const tm=new Date(s);tm.setDate(tm.getDate()+1);const e=new Date(s);e.setDate(e.getDate()+2);
 const{data,error}=await sb.from("predictions").select(COLS).gte("kickoff",yd.toISOString()).lt("kickoff",e.toISOString()).is("settled_at",null).order("kickoff");
 if(error&&!first)return;
 const all=(data||[]).filter(m=>m.live_status||new Date(m.kickoff).getTime()>Date.now()-3*36e5);
 const sig=s.toDateString()+JSON.stringify(all.map(m=>[m.fixture_id,m.live_status,m.live_home,m.live_away,m.live_minute]));
 if(!first&&!error&&sig===lastSig)return; // rien n'a changé : on ne redessine pas la liste
 lastSig=sig;cache={all,error,s,tm};build();
 ensureLogos(all.slice(0,60),build)};
await loadHome(true);
setInterval(()=>{if(!document.hidden)loadHome(false)},60000);
const render=(t,a)=>a.length?'<p class="sub dh">'+t+' ('+a.length+')</p>'+a.map(card).join(""):"";
const doSearch=async()=>{const my=++tok,q=clean(),dv=$("qd").value;
 if(q.length<2&&!dv){$("list").innerHTML=homeHTML;return}
 const s=new Date();s.setHours(0,0,0,0);
 let a=sb.from("predictions").select(COLS).order("kickoff",{ascending:false}).limit(60);
 if(q.length>=2)a=a.or("home.ilike.%"+q+"%,away.ilike.%"+q+"%,league.ilike.%"+q+"%");
 if(dv){const d0=new Date(dv+"T00:00:00"),d1=new Date(d0);d1.setDate(d1.getDate()+1);a=a.gte("kickoff",d0.toISOString()).lt("kickoff",d1.toISOString())}
 const{data:r,error:er}=await a;if(my!==tok)return;
 if(er){$("list").innerHTML='<div class="card">Recherche impossible pour le moment. Réessaie dans un instant.</div>';return}
 const up=(r||[]).filter(m=>new Date(m.kickoff)>=s).reverse(),past=(r||[]).filter(m=>new Date(m.kickoff)<s);
 const html=()=>(up.length||past.length)?render("À venir",up)+render("Déjà joués",past):'<div class="card"><b>Aucun match trouvé.</b><p class="sub" style="margin:8px 0 0">Essaie un autre nom d’équipe, de compétition ou une autre date.</p></div>';
 $("list").innerHTML=html();
 ensureLogos(r||[],()=>{if(my===tok)$("list").innerHTML=html()})};
let tm_;$("q").oninput=()=>{clearTimeout(tm_);tm_=setTimeout(doSearch,300)};$("qd").onchange=doSearch;
})();
</script><script src="pwa.js" defer></script></body></html>

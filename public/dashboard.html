<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Hanken+Grotesk:wght@400;500;700&display=swap"><link rel="stylesheet" href="style.css"><title>Matchs du jour – Coup d’Avance</title></head><body><div class="wrap">
<header class="top"><a class="logo" href="index.html">Coup d’Avance</a><div class="user"><span id="who"></span><a href="historique.html" class="out">Historique</a><a href="#" id="out" class="out">Quitter</a></div></header>
<h1 class="pt">Matchs du jour</h1><p class="sub" id="date"></p>
<p class="sub" style="text-transform:none;font-size:14px;margin:-12px 0 16px">Ce sont des estimations statistiques, jamais des certitudes. Un pourcentage de 63 % veut dire que le résultat échoue quand même environ 4 fois sur 10. Ne mise que ce que tu peux te permettre de perdre.</p>
<div class="srch"><input id="q" type="search" placeholder="Rechercher une équipe ou une compétition…" autocomplete="off"><input id="qd" type="date" aria-label="Date du match"></div>
<div id="bilan"></div>
<div id="list"><p class="sub">Chargement des matchs…</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script src="config.js"></script><script>
const $=i=>document.getElementById(i),sb=supabase.createClient(CFG.url,CFG.key);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LB={home:"victoire à domicile",draw:"match nul",away:"victoire à l’extérieur"};
const yn=b=>b?"✔":"✘";
const fr=n=>String(n).replace(".",",");
$("date").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
// Match en cours : badge rouge + score en direct
const liveBox=m=>{const ht=m.live_status==="HT";
  return '<div class="res live"><div class="sc">'+(m.live_home==null?0:m.live_home)+' – '+(m.live_away==null?0:m.live_away)+'<small>Score en direct</small></div>'
  +'<div class="vd"><span class="lv"><i></i>'+(ht?"MI-TEMPS":"EN COURS")+'</span>'+(!ht&&m.live_minute?'<small>'+m.live_minute+'’</small>':"")+'</div></div>'};
const result=m=>{
  if(m.settled_at&&m.final_home!=null){const v=m.verdict||{};
    return '<div class="res '+(v.ok1x2?"ok":"ko")+'"><div class="sc">'+m.final_home+' – '+m.final_away+'<small>Score final</small></div>'
    +'<div class="vd"><b>'+(v.ok1x2?"✔ Pronostic juste":"✘ Pronostic raté")+'</b><small>Prévu : '+(LB[v.predicted]||"?")+'</small></div></div>'
    +(v.btts&&v.over25?'<div class="chk">Les deux marquent '+yn(v.btts.ok)+' · Plus de 2,5 buts '+yn(v.over25.ok)+' · Score exact '+yn(v.scoreHit)+'</div>':"")}
  if(m.settled_at)return '<div class="res wait">Match annulé ou non joué ('+esc(m.final_status)+')</div>';
  if(m.live_status)return liveBox(m);
  if(new Date(m.kickoff)<Date.now())return '<div class="res wait">Match en cours ou résultat en attente…</div>';
  return ""};
// Corners et fautes prévus (si disponibles pour ce match)
const xt=d=>{const e=d.extra;if(!e)return"";let a="";
  if(e.corners)a+='<div>Corners prévus<b>'+fr(e.corners.total)+'</b></div><div>Plus de 9,5 corners<b>'+e.corners.over["9.5"]+'%</b></div>';
  if(e.fouls)a+='<div>Fautes prévues<b>'+fr(e.fouls.total)+'</b></div>';
  return a?'<div class="stats x">'+a+'</div>':""};
const card=m=>{const d=m.data,p=d.result,cf=Math.max(p.home,p.draw,p.away),tag=/friendl/i.test(m.league||"")?'<span class="cf lo">Match amical · très imprévisible</span>':cf>=55?'<span class="cf hi">Favori probable</span>':'<span class="cf lo">Match incertain</span>',t=new Date(m.kickoff).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})+" · "+new Date(m.kickoff).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
return '<div class="card"><div class="tm">'+esc(m.home)+' <span>contre</span> '+esc(m.away)+'</div><div class="mk">'+esc(m.league||"")+' · '+t+' · '+tag+'</div>'
+'<div class="bar"><span class="h" style="flex:'+p.home+'">'+p.home+'%</span><span class="d" style="flex:'+p.draw+'">'+p.draw+'%</span><span class="a" style="flex:'+p.away+'">'+p.away+'%</span></div>'
+'<div class="lg"><span>Domicile</span><span>Nul</span><span>Extérieur</span></div>'
+'<div class="stats"><div>Les deux marquent<b>'+d.btts+'%</b></div><div>Plus de 2,5 buts<b>'+d.over["2.5"]+'%</b></div><div>Score probable<b>'+esc(d.likelyScore)+'</b></div></div>'+xt(d)+result(m)+'</div>'};
(async()=>{const{data:{session}}=await sb.auth.getSession();if(!session)return location.href="auth.html#login";
$("who").textContent=session.user.email;
let homeHTML="",tok=0;
const searching=()=>$("q").value.replace(/[%_,()*\\]/g," ").trim().length>=2||!!$("qd").value;
// Liste du jour : matchs en cours en premier (rouge), puis aujourd’hui et demain. Actualisée toutes les 60 s.
const loadHome=async first=>{
 const s=new Date();s.setHours(0,0,0,0);
 const yd=new Date(s);yd.setDate(yd.getDate()-1);const tm=new Date(s);tm.setDate(tm.getDate()+1);const e=new Date(s);e.setDate(e.getDate()+2);
 const{data,error}=await sb.from("predictions").select("*").gte("kickoff",yd.toISOString()).lt("kickoff",e.toISOString()).is("settled_at",null).order("kickoff");
 if(error&&!first)return;
 const all=(data||[]).filter(m=>m.live_status||new Date(m.kickoff).getTime()>Date.now()-3*36e5);
 const liveNow=all.filter(m=>m.live_status),rest=all.filter(m=>!m.live_status);
 const day=d=>rest.filter(m=>new Date(m.kickoff).toDateString()===d.toDateString());
 const part=(t,d,hideEmpty)=>{const a=day(d);if(!a.length&&hideEmpty)return"";return '<p class="sub dh">'+t+' ('+a.length+')</p>'+(a.length?a.map(card).join(""):'<div class="card"><p class="sub" style="margin:0">Plus aucun match à venir pour le moment.</p></div>')};
 homeHTML=error?'<div class="card">Impossible de charger les matchs. Réessaie dans un instant.</div>':all.length?(liveNow.length?'<p class="sub dh rd">En cours ('+liveNow.length+')</p>'+liveNow.map(card).join(""):"")+part("Aujourd’hui",s,liveNow.length>0)+part("Demain",tm):'<div class="card"><b>Pas encore de pronostics pour aujourd’hui ni demain.</b><p class="sub" style="margin:8px 0 0">Ils sont calculés toutes les 5 minutes. Il peut aussi n’y avoir aucun match dans les compétitions couvertes.</p></div>';
 if(!searching())$("list").innerHTML=homeHTML};
await loadHome(true);
setInterval(()=>{if(!document.hidden)loadHome(false)},60000);
const render=(t,a)=>a.length?'<p class="sub dh">'+t+' ('+a.length+')</p>'+a.map(card).join(""):"";
const doSearch=async()=>{const my=++tok,q=$("q").value.replace(/[%_,()*\\]/g," ").trim(),dv=$("qd").value;
 if(q.length<2&&!dv){$("list").innerHTML=homeHTML;return}
 const s=new Date();s.setHours(0,0,0,0);
 let a=sb.from("predictions").select("*").order("kickoff",{ascending:false}).limit(80);
 if(q.length>=2)a=a.or("home.ilike.%"+q+"%,away.ilike.%"+q+"%,league.ilike.%"+q+"%");
 if(dv){const d0=new Date(dv+"T00:00:00"),d1=new Date(d0);d1.setDate(d1.getDate()+1);a=a.gte("kickoff",d0.toISOString()).lt("kickoff",d1.toISOString())}
 const{data:r,error:er}=await a;if(my!==tok)return;
 if(er){$("list").innerHTML='<div class="card">Recherche impossible pour le moment. Réessaie dans un instant.</div>';return}
 const up=(r||[]).filter(m=>new Date(m.kickoff)>=s).reverse(),past=(r||[]).filter(m=>new Date(m.kickoff)<s);
 $("list").innerHTML=(up.length||past.length)?render("À venir",up)+render("Déjà joués",past):'<div class="card"><b>Aucun match trouvé.</b><p class="sub" style="margin:8px 0 0">Essaie un autre nom d’équipe, de compétition ou une autre date.</p></div>'};
let tm_;$("q").oninput=()=>{clearTimeout(tm_);tm_=setTimeout(doSearch,300)};$("qd").onchange=doSearch;
const{data:all}=await sb.from("predictions").select("verdict").not("verdict","is",null).limit(5000);
const n=all?all.length:0;
if(n){const c=f=>all.filter(f).length,pc=x=>Math.round(100*x/n)+" %";
$("bilan").innerHTML='<div class="card bilan"><b>Bilan des pronostics</b><div class="stats"><div>Résultat 1X2 juste<b>'+c(x=>x.verdict.ok1x2)+'/'+n+' · '+pc(c(x=>x.verdict.ok1x2))+'</b></div><div>Les deux marquent<b>'+pc(c(x=>x.verdict.btts&&x.verdict.btts.ok))+'</b></div><div>Plus de 2,5 buts<b>'+pc(c(x=>x.verdict.over25&&x.verdict.over25.ok))+'</b></div></div></div>'}
else $("bilan").innerHTML='<p class="sub" style="text-transform:none">Le score final et la comparaison avec le pronostic s’affichent ici après chaque match.</p>'})();
$("out").onclick=async ev=>{ev.preventDefault();await sb.auth.signOut();location.href="index.html"};
</script></body></html>

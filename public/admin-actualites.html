<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#130F33"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Hanken+Grotesk:wght@400;500;700&display=swap"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="news.css"><title>Actualités – Administration – PronostBet</title>
<style>.am select,.am input{font:inherit;font-size:15px;padding:9px 10px;border:1px solid #3A2F9A;border-radius:10px;background:#130F33;color:#fff;min-width:0}.am .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.am .row>*{flex:0 0 auto}.am .nw-act{flex:0 0 auto;padding:0 14px}.am .nw-act.bad{background:#B42318;border-color:#B42318}.am .nw-act.ok{background:#14532D;border-color:#14532D}.am .fl{font-size:12px;color:#FFD9A8}.am table{width:100%;border-collapse:collapse;font-size:14px}.am td,.am th{padding:8px 6px;border-bottom:1px solid #322A7E;text-align:left;vertical-align:top;overflow-wrap:anywhere}.am .tw{overflow-x:auto}</style></head><body class="nw am"><div class="wrap">
<header class="top"><a class="logo" href="index.html"><img src="icons/icon-192.png" alt="" width="34" height="34"><span>PRONOST<b>BET</b></span></a></header>
<h1 class="pt">Actualités</h1><p class="sub" style="text-transform:none">Modération, signalements, sources et flux.</p>
<div class="nw-tabs" id="tabs" role="tablist"></div>
<div id="v"><p class="sub">Chargement…</p></div><div style="height:90px"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script src="config.js"></script><script>
const $=i=>document.getElementById(i),sb=supabase.createClient(CFG.url,CFG.key);
</script><script src="admin-menu.js"></script><script>
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"#";
const CATS=["mercato","clubs","joueurs","matchs","blessures","international","analyses"];
const TABS=[["pending","À modérer"],["approved","Approuvées"],["rejected","Rejetées"],["reports","Signalements"],["config","Sources et flux"]];
let TAB="pending",ME=null;
const dt=s=>s?new Date(s).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"—";
const opt=(arr,v,lbl)=>arr.map(x=>'<option value="'+x+'"'+(x===v?" selected":"")+'>'+esc(lbl?lbl[x]:x)+'</option>').join("");
let DISC=[];
const siteName=f=>{try{const h=new URL(f.url).hostname.replace(/^www\./,"").split(".")[0];return h.charAt(0).toUpperCase()+h.slice(1)}catch{return f.title||""}};
function drawTabs(){$("tabs").innerHTML=TABS.map(t=>'<button type="button" role="tab" data-t="'+t[0]+'" aria-selected="'+(t[0]===TAB)+'">'+t[1]+'</button>').join("")}
$("tabs").onclick=e=>{const b=e.target.closest("[data-t]");if(b){TAB=b.dataset.t;drawTabs();render()}};
const upd=async(id,patch)=>{const{error}=await sb.from("news_articles").update({...patch,moderated_by:ME,moderated_at:new Date().toISOString()}).eq("id",id);if(error)alert("Erreur : "+error.message);return!error};
function art(a){return'<article class="nw-card" data-id="'+a.id+'"><div class="nw-badges"><span class="nw-b">'+esc(a.category)+'</span>'+(a.transfer_status?'<span class="nw-b '+a.transfer_status+'">'+esc(a.transfer_status)+'</span>':'')+'</div>'
 +'<h2><a href="'+esc(safeUrl(a.url))+'" target="_blank" rel="noopener noreferrer nofollow">'+esc(a.title)+'</a></h2>'
 +'<div class="nw-meta"><b>'+esc(a.source_name)+'</b><span>'+dt(a.published_at)+'</span></div>'
 +((a.flags||[]).length?'<div class="fl">⚠ '+esc(a.flags.join(", "))+(a.mod_reason?' — '+esc(a.mod_reason):'')+'</div>':'')
 +'<div class="row"><select data-k="category" aria-label="Catégorie">'+opt(CATS,a.category)+'</select>'
 +'<select data-k="transfer_status" aria-label="Statut du transfert"><option value="">Pas un transfert</option>'+opt(["official","rumor","unverified"],a.transfer_status,{official:"Officiel (confirmé par moi)",rumor:"Rumeur",unverified:"Non vérifié"})+'</select></div>'
 +'<div class="nw-acts" style="flex-wrap:wrap">'+(a.moderation_status!=="approved"?'<button class="nw-act ok" data-a="approve">Approuver</button>':'')+(a.moderation_status!=="rejected"?'<button class="nw-act bad" data-a="reject">Rejeter</button>':'')
 +'<button class="nw-act" data-a="feat">'+(a.featured?"★ Retirer de la une":"☆ Mettre à la une")+'</button></div></article>'}
async function list(st){const{data,error}=await sb.from("news_articles").select("*").eq("moderation_status",st).order("published_at",{ascending:false}).limit(60);
  if(error)return'<div class="card">'+esc(error.message)+'</div>';
  return data.length?'<div class="nw-list">'+data.map(art).join("")+'</div>':'<div class="card nw-empty">Rien ici.</div>'}
async function reports(){const{data,error}=await sb.from("news_reports").select("id,reason,created_at,article:news_articles(id,title,url,source_name,moderation_status)").order("created_at",{ascending:false}).limit(200);
  if(error)return'<div class="card">'+esc(error.message)+'</div>';
  const g={};(data||[]).forEach(r=>{if(!r.article)return;(g[r.article.id]=g[r.article.id]||{a:r.article,n:0}).n++});
  const v=Object.values(g);return v.length?'<div class="nw-list">'+v.map(x=>'<article class="nw-card" data-id="'+x.a.id+'"><div class="nw-badges"><span class="nw-b rumor">'+x.n+' signalement'+(x.n>1?"s":"")+'</span><span class="nw-b">'+esc(x.a.moderation_status)+'</span></div><h2><a href="'+esc(safeUrl(x.a.url))+'" target="_blank" rel="noopener noreferrer nofollow">'+esc(x.a.title)+'</a></h2><div class="nw-meta"><b>'+esc(x.a.source_name)+'</b></div><div class="nw-acts" style="flex-wrap:wrap"><button class="nw-act bad" data-a="reject">Rejeter l’article</button><button class="nw-act" data-a="dismiss">Ignorer les signalements</button></div></article>').join("")+'</div>':'<div class="card nw-empty">Aucun signalement.</div>'}
async function config(){
  const[f,s]=await Promise.all([sb.from("news_feeds").select("*").order("id"),sb.from("news_sources").select("*").order("kind").order("domain")]);
  return'<div class="sec"><h2>Ajouter un site</h2><p class="note">Collez l’adresse d’un site (ex. footmercato.net) : son flux RSS est recherché automatiquement, avec un aperçu avant d’ajouter.</p><div class="row" style="margin:8px 0"><input id="fu" placeholder="adresse du site ou du flux" autocapitalize="none" inputmode="url"><button class="nw-act go" id="fsearch">Chercher le flux</button></div><div id="fres"></div></div>'
   +'<div class="sec"><h2>Flux</h2><div class="tw"><table><tr><th>Flux</th><th>Licence</th><th>Dernière synchro</th><th>Actif</th></tr>'
   +(f.data||[]).map(x=>'<tr><td>'+esc(x.label)+'<br><small>'+esc(x.provider)+'</small></td><td>'+esc(x.license)+'</td><td>'+(x.last_status==="ok"?"✓ "+(x.last_count||0)+" articles":'<span class="fl">'+esc(x.last_error||"jamais")+'</span>')+'<br><small>'+dt(x.last_fetched_at)+'</small></td><td><input type="checkbox" data-feed="'+esc(x.id)+'"'+(x.enabled?" checked":"")+' aria-label="Activer"></td></tr>').join("")+'</table></div></div>'
  +'<div class="sec"><h2>Réputation des sources</h2><p class="note"><b>official</b> = seule catégorie pouvant donner le badge « Officiel » (club, ligue, fédération). <b>trusted</b> = média fiable. <b>blocked</b> = rejet automatique.</p>'
   +'<div class="row" style="margin:8px 0"><input id="sd" placeholder="domaine (ex. psg.fr)" autocapitalize="none"><input id="sn" placeholder="ou nom exact"><select id="sk">'+opt(["official","trusted","blocked"],"official")+'</select><button class="nw-act go" id="sadd">Ajouter</button></div>'
   +'<div class="tw"><table>'+(s.data||[]).map(x=>'<tr><td>'+esc(x.domain||x.name)+'</td><td>'+esc(x.kind)+'</td><td><button class="nw-act" data-sdel="'+x.id+'">Retirer</button></td></tr>').join("")+'</table></div></div>'}
async function render(){$("v").innerHTML='<p class="sub">Chargement…</p>';$("v").innerHTML=TAB==="reports"?await reports():TAB==="config"?await config():await list(TAB)}
$("v").onchange=async e=>{const t=e.target,c=t.closest("[data-id]");
  if(c&&t.dataset.k){const v=t.value||null,p={[t.dataset.k]:v};if(t.dataset.k==="transfer_status")p.verification_note=v==="official"?"Confirmé manuellement par la modération.":null;if(await upd(c.dataset.id,p))t.blur()}
  if(t.dataset.feed){await sb.from("news_feeds").update({enabled:t.checked}).eq("id",t.dataset.feed)}};
$("v").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const c=b.closest("[data-id]"),a=b.dataset.a;
  if(c&&a){const id=c.dataset.id;let ok=false;
    if(a==="approve")ok=await upd(id,{moderation_status:"approved",mod_reason:null});
    if(a==="reject")ok=await upd(id,{moderation_status:"rejected",featured:false});
    if(a==="feat")ok=await upd(id,{featured:b.textContent.includes("Mettre")});
    if(a==="dismiss"){ok=!(await sb.from("news_reports").delete().eq("article_id",id)).error}
    if(ok)render()}
  if(b.id==="sadd"){const d=$("sd").value.trim().toLowerCase().replace(/^https?:\/\//,"").replace(/^www\./,"").replace(/\/.*$/,""),n=$("sn").value.trim();if(!d&&!n)return;
    const{error}=await sb.from("news_sources").insert({domain:d||null,name:n||null,kind:$("sk").value});if(error)alert(error.message);else render()}
  if(b.id==="fsearch"){const u=$("fu").value.trim();if(!u)return;const r=$("fres");r.innerHTML='<p class="sub">Recherche en cours…</p>';b.disabled=true;
    const{data,error}=await sb.functions.invoke("discover-feed",{body:{url:u}});b.disabled=false;
    if(error||!data){r.innerHTML='<p class="fl">Recherche impossible pour le moment.</p>';return}
    DISC=data.feeds||[];
    if(!DISC.length){r.innerHTML='<p class="fl">'+esc(data.error||"Aucun flux RSS trouvé sur ce site.")+' Il restera couvert par Google News.</p>';return}
    r.innerHTML=DISC.map((f,i)=>'<div class="card" style="margin:8px 0;padding:12px"><b>'+esc(f.title||f.url)+'</b><br><small>'+esc(f.url)+'</small><br><small>'+f.count+' articles · '+f.with_image+' avec image</small><ul>'+f.sample.map(x=>'<li>'+esc(x.title)+'</li>').join("")+'</ul><div class="row"><input data-fl="'+i+'" value="'+esc(siteName(f))+'" aria-label="Nom de la source"><button class="nw-act go" data-fadd="'+i+'">Ajouter ce flux</button></div></div>').join("")}
  if(b.dataset.fadd){const i=+b.dataset.fadd,f=DISC[i];if(!f)return;const name=document.querySelector('[data-fl="'+i+'"]').value.trim()||f.title;
    const id="rss-"+new URL(f.url).hostname.replace(/^www\./,"").replace(/[^a-z0-9]+/g,"-")+"-"+Date.now().toString(36).slice(-4);
    const{error}=await sb.from("news_feeds").insert({id,provider:"rss",url:f.url,label:name,license:"test_only",enabled:true});
    if(error)alert(error.message);else render()}
  if(b.dataset.sdel){await sb.from("news_sources").delete().eq("id",b.dataset.sdel);render()}};
(async()=>{const{data:{session}}=await sb.auth.getSession();if(!session)return location.href="auth.html#login";
  const{data:adm}=await sb.rpc("is_admin");if(!adm)return location.href="dashboard.html";ME=session.user.id;drawTabs();render()})();
</script></body></html>

<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#130F33"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PronostBet"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Hanken+Grotesk:wght@400;500;700&display=swap"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="predview.css"><link rel="stylesheet" href="theme.css"><title>Historique – PronostBet</title></head><body class="pd hist"><div class="wrap">
<header class="top"><a class="logo" href="index.html"><img src="icons/icon-192.png" alt="" width="34" height="34"><span>PRONOST<b>BET</b></span></a></header>
<h1 class="pt">Historique</h1><p class="sub">Scores finaux et pronostics des matchs terminés</p>
<div class="srch"><input id="hq" type="search" placeholder="Rechercher une équipe ou une compétition…" autocomplete="off"><input id="hd" type="date" aria-label="Date du match"></div>
<div class="flt" id="flt"><button data-f="ok">✔ Gagnés</button><button data-f="ko">✘ Ratés</button></div>
<p class="sub" id="tabinfo" style="margin:0 0 6px"></p>
<div id="list"><p class="sub">Chargement…</p></div>
<button id="more" class="more" style="display:none">Voir plus</button>
<p class="note" style="text-align:center;margin:28px 0 8px">Propulsé par <a href="https://kickoffapi.com" target="_blank" rel="noopener">KickoffAPI</a></p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script src="config.js"></script><script src="i18n.js"></script><script>
const $=i=>document.getElementById(i),sb=supabase.createClient(CFG.url,CFG.key);
</script><script src="cards.js"></script><script src="menu.js"></script><script>
const PAGE=10,HASH={ok:"gagnes",ko:"rates"};
const fromHash=()=>({"#gagnes":"ok","#rates":"ko"})[location.hash]||"ok";
const INFO={ok:"Pronostics justes : bon résultat (1X2) ou score exact trouvé.",ko:"Pronostics ratés : ni le bon résultat, ni le score exact."};
const EMPTY={ok:"Aucun pronostic gagné pour le moment.",ko:"Aucun pronostic raté pour le moment."};
let rows=[],filter=fromHash(),from=0,more=true;
const dayLabel=k=>new Date(k+"T12:00:00").toLocaleDateString((window.PB?PB.loc():"fr-FR"),{weekday:"long",day:"numeric",month:"long"});
const keyOf=m=>{const x=new Date(m.kickoff);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
function draw(){
  if(!rows.length){$("list").innerHTML='<div class="card"><p class="sub" style="margin:0">'+(searching()?"Aucun match trouvé pour cette recherche.":EMPTY[filter])+'</p></div>';$("more").style.display=more?"block":"none";return}
  const g={};rows.forEach(m=>(g[keyOf(m)]=g[keyOf(m)]||[]).push(m));
  $("list").innerHTML=Object.keys(g).sort().reverse().map(k=>'<p class="sub dh">'+dayLabel(k)+'</p>'+g[k].map(histCard).join("")).join("");
  $("more").style.display=more?"block":"none"}
const COLS="fixture_id,kickoff,league,home,away,data,settled_at,final_home,final_away,final_status,verdict,live_status,live_home,live_away,live_minute,final_stats";
// Chaque onglet filtre côté serveur : les compteurs et la pagination restent exacts
// ok = bon résultat 1X2 OU score exact ; ko = ni l'un ni l'autre ; other = annulé / non joué, ou sans résultat 3 h après le coup d'envoi
function byTab(a,t){
  if(t==="ok")return a.not("settled_at","is",null).or("verdict->>ok1x2.eq.true,verdict->>scoreHit.eq.true");
  if(t==="ko")return a.not("settled_at","is",null).eq("verdict->>ok1x2","false").or("verdict->>scoreHit.is.null,verdict->>scoreHit.eq.false");
  const lim=new Date(Date.now()-3*3600e3).toISOString();
  return a.or("and(settled_at.not.is.null,verdict.is.null),and(settled_at.is.null,kickoff.lt."+lim+")")}
// Recherche : équipe, compétition ou date (côté serveur)
let tok=0;
const clean=()=>$("hq").value.replace(/[%_,()*\\]/g," ").trim();
const searching=()=>clean().length>=2||!!$("hd").value;
function bySearch(a){const q=clean(),dv=$("hd").value;
  if(q.length>=2)a=a.or("home.ilike.%"+q+"%,away.ilike.%"+q+"%,league.ilike.%"+q+"%");
  if(dv){const d0=new Date(dv+"T00:00:00"),d1=new Date(d0);d1.setDate(d1.getDate()+1);a=a.gte("kickoff",d0.toISOString()).lt("kickoff",d1.toISOString())}
  return a}
const qb=()=>bySearch(byTab(sb.from("predictions_safe").select(COLS),filter)).order("kickoff",{ascending:false});
function setTab(){document.querySelectorAll("#flt button").forEach(x=>x.classList.toggle("on",x.dataset.f===filter));$("tabinfo").textContent=INFO[filter]}
function reset(){tok++;rows=[];from=0;more=true;$("more").style.display="none";$("list").innerHTML='<p class="sub">Recherche…</p>';setTab();$("more").disabled=false;load()}
async function load(){const my=tok,mb=$("more");mb.disabled=true;
  const{data,error}=await qb().range(from,from+PAGE-1);
  if(my!==tok)return;
  mb.disabled=false;
  if(error){$("list").innerHTML='<div class="card">Impossible de charger l’historique. Réessaie dans un instant.</div>';return}
  rows=rows.concat(data||[]);from+=PAGE;more=(data||[]).length===PAGE;draw();ensureLogos(data||[],draw)}
(async()=>{const{data:{session}}=await sb.auth.getSession();if(!session)return location.href="auth.html#login";
document.querySelectorAll("#flt button").forEach(b=>b.onclick=()=>{if(filter===b.dataset.f)return;filter=b.dataset.f;history.replaceState(null,"","#"+HASH[filter]);reset()});
window.addEventListener("hashchange",()=>{const f=fromHash();if(f!==filter){filter=f;reset()}});
$("more").onclick=load;
let t_;$("hq").oninput=()=>{clearTimeout(t_);t_=setTimeout(reset,300)};$("hd").onchange=reset;
reset()})();
</script><script src="pwa.js" defer></script></body></html>

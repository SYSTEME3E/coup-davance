<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#130F33"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Hanken+Grotesk:wght@400;500;700&display=swap"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme.css"><title>Statistiques – Administration – PronostBet</title>
<style>.kp.wide{grid-column:1/-1}.kp b.big{font-size:34px}.kp b.gn{color:#0B6B33}.kp b.rd{color:#B42318}.bar2{height:12px;border-radius:6px;background:#E4E5EE;overflow:hidden;margin:10px 0 6px}.bar2 i{display:block;height:100%;background:#16A34A}.lg2{display:flex;justify-content:space-between;font-size:13px}.eq{margin:0;font-size:15px;line-height:1.6}.eq div{display:flex;justify-content:space-between;gap:10px;padding:4px 0}.eq .tt{border-top:1px solid #E4E5EE;margin-top:4px;padding-top:8px;font-weight:800}</style>
</head><body><div class="wrap">
<header class="top"><a class="logo" href="index.html"><img src="icons/icon-192.png" alt="" width="34" height="34"><span>PRONOST<b>BET</b></span></a></header>
<h1 class="pt">Statistiques</h1><p class="sub" style="text-transform:none">Inscrits, abonnés, retraits et bénéfice</p>
<div id="msg"></div>
<h2 class="hh" style="margin:18px 0 8px">Utilisateurs</h2>
<div id="usr" class="kpi"><p class="sub">Chargement…</p></div>
<div id="sub"></div>
<h2 class="hh" style="margin:18px 0 8px">Retraits</h2>
<div id="wd" class="kpi"></div>
<h2 class="hh" style="margin:18px 0 8px">Argent</h2>
<div id="mon" class="kpi"></div>
<div id="eq"></div>
<div style="height:40px"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script src="config.js"></script><script>
const $=i=>document.getElementById(i),sb=supabase.createClient(CFG.url,CFG.key);
</script><script src="admin-menu.js"></script>
<script>
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const N=n=>Number(n||0).toLocaleString("fr-FR"),F=n=>N(Math.round(Number(n||0)))+" F";
const kp=(l,v,cls,s,w)=>'<div class="kp'+(w?' wide':'')+'"><span>'+l+'</span><b class="'+(cls||"")+'">'+v+'</b>'+(s?'<small>'+s+'</small>':"")+'</div>';
async function load(){
  const[st,wt,fin,wd]=await Promise.all([sb.rpc("admin_stats"),sb.rpc("admin_wallet_totals"),sb.rpc("admin_finance_stats"),sb.rpc("admin_withdrawals",{lim:5000})]);
  if(st.error&&st.error.code==="42501")return location.href="dashboard.html";
  const s=st.data||{},w=wt.data||{},f=fin.data;
  // Utilisateurs : inscrits, abonnés actifs, inactifs (inscrits sans VIP actif)
  const users=Number(s.users||0),act=Number(s.subs_active||0),ina=Math.max(0,users-act),pct=users?Math.round(act/users*100):0;
  $("usr").innerHTML=kp("Inscrits",N(users),"big","+"+N(s.users_7d||0)+" cette semaine",1)
    +kp("Abonnés actifs",N(act),"gn",pct+" % des inscrits")+kp("Inactifs",N(ina),"","inscrits sans VIP actif");
  $("sub").innerHTML='<div class="bar2"><i style="width:'+pct+'%"></i></div><div class="lg2"><span>'+N(act)+' actifs</span><span>'+N(ina)+' inactifs</span></div>';
  // Retraits : nombre et montant total retiré (retraits payés)
  let wc=0,wtot=0,wfee=0;
  if(f){wc=f.withdrawals_count;wtot=f.withdrawals_total;wfee=f.withdrawals_fees}
  else if(!wd.error&&Array.isArray(wd.data)){wd.data.filter(x=>x.status==="paid").forEach(x=>{wc++;wtot+=Number(x.amount||0);wfee+=Number(x.fee||0)})}
  const open=Array.isArray(wd.data)?wd.data.filter(x=>["pending","processing","manual"].includes(x.status)).length:0;
  $("wd").innerHTML=kp("Retraits effectués",N(wc),"",open?open+" en attente":"")+kp("Total retiré",F(wtot),"","montant demandé, frais inclus");
  // Argent
  if(!f){
    $("mon").innerHTML=kp("Gagné par les parrains",F(w.earned),"","récompenses créditées",1);
    $("eq").innerHTML='<div class="card"><b>Revenus d’abonnements indisponibles</b><p class="note" style="margin:6px 0 0">'+esc(fin.error?fin.error.message:"")+'<br>Exécute une fois le fichier <b>supabase/sql/admin_finance_stats.sql</b> dans Supabase (SQL Editor), puis recharge cette page.</p></div>';
    return}
  const rev=Number(f.revenue_f||0),ref=Number(f.referral_f||0),net=rev-ref;
  $("mon").innerHTML=kp("Total gagné en abonnements",F(rev),"big",N(f.payments_count)+" paiements · Basic "+F(f.revenue_basic_f)+" · Gold "+F(f.revenue_gold_f),1)
    +kp("Payé aux parrains",F(ref),"rd","récompenses de parrainage")
    +kp("Bénéfice net",F(net),net>=0?"gn":"rd","après les parrains");
  $("eq").innerHTML='<div class="sec"><h2>Calcul du bénéfice</h2><div class="eq"><div><span>Abonnements encaissés</span><b>'+F(rev)+'</b></div><div><span>− Récompenses parrains</span><b>'+F(ref)+'</b></div><div class="tt"><span>= Bénéfice net</span><b>'+F(net)+'</b></div></div>'
    +'<p class="note" style="margin:10px 0 0">Les frais de retrait ('+F(wfee)+' perçus) ne sont pas comptés dans ce bénéfice.'+(Number(f.unconverted)>0?'<br>⚠ '+N(f.unconverted)+' paiement(s) sans taux de change : non comptés (Prix VIP › taux).':"")+'</p></div>'}
(async()=>{const{data:{session}}=await sb.auth.getSession();if(!session)return location.href="auth.html#login";
  const{data:adm}=await sb.rpc("is_admin");if(!adm)return location.href="dashboard.html";
  load();setInterval(()=>{if(!document.hidden)load()},60000)})();
</script></body></html>

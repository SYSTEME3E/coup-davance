<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#1D6FD8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Hanken+Grotesk:wght@400;500;700&display=swap"><link rel="stylesheet" href="style.css"><style>[hidden]{display:none!important}.ab{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ab .btn{width:auto;flex:1;min-width:130px;padding:10px 14px}</style><title>Retraits – Administration</title></head><body><div class="wrap">
<header class="top"><a class="logo" href="index.html"><img src="icon.svg" alt="" width="34" height="34"><span>Pronos-bet</span></a></header>
<h1 class="pt">Retraits</h1><p class="sub" style="text-transform:none">Les retraits « en attente » ou « en cours » depuis longtemps sont à vérifier ici. <a href="admin.html">← Administration</a></p>
<div class="flt" id="flt"><button data-s="open" class="on" type="button">À suivre</button><button data-s="" type="button">Tous</button></div>
<div id="msg" class="pfm" role="status"></div>
<div id="list"><p class="sub">Chargement…</p></div><div style="height:40px"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script src="config.js"></script><script>
const $=i=>document.getElementById(i),sb=supabase.createClient(CFG.url,CFG.key);
</script><script src="menu.js"></script><script>
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=s=>s?new Date(s).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"—";
const ST={pending:["in","En attente"],processing:["in","En cours"],paid:["ok","Payé"],failed:["ko","Échoué"],canceled:["mu","Annulé"]};
let filter="open",rows=[];
const draw=()=>{const l=filter==="open"?rows.filter(w=>w.status==="pending"||w.status==="processing"):rows;
 $("list").innerHTML=l.length?l.map(w=>{const s=ST[w.status]||["mu",w.status],open=w.status==="pending"||w.status==="processing";
  return '<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>'+Number(w.amount).toLocaleString("fr-FR")+' F</b><span class="bd '+s[0]+'">'+s[1]+'</span></div>'
  +'<div class="kv"><span>Utilisateur</span><b>'+esc(w.full_name||w.email)+'</b></div>'
  +'<div class="kv"><span>Destination</span><b>'+esc(w.country)+' · '+esc(w.network)+' · '+esc(w.phone)+'</b></div>'
  +'<div class="kv"><span>Demandé le</span><b>'+dt(w.created_at)+'</b></div>'
  +(w.provider_ref?'<div class="kv"><span>Réf. MoneyFusion</span><b>'+esc(w.provider_ref)+'</b></div>':"")
  +(w.error?'<p class="note">'+esc(w.error)+'</p>':"")
  +(open?'<div class="ab"><button class="btn" data-w="'+w.id+'" data-s="paid" type="button">Marquer payé</button><button class="btn danger" data-w="'+w.id+'" data-s="failed" type="button">Échoué + recréditer</button></div>':"")+'</div>'}).join(""):'<div class="card"><p class="sub" style="margin:0">Aucun retrait.</p></div>';
 document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>act(b.dataset.w,b.dataset.s))};
async function load(){const{data,error}=await sb.rpc("admin_withdrawals",{lim:100});
 if(error){if(error.code==="42501")return location.href="dashboard.html";$("list").innerHTML='<div class="card">'+esc(error.message)+'</div>';return}
 rows=data||[];draw()}
async function act(id,st){
 if(!confirm(st==="paid"?"Confirmer que ce retrait a bien été payé à l’utilisateur ?":"Marquer ce retrait comme échoué et recréditer l’utilisateur ?\nVérifie d’abord dans MoneyFusion qu’il n’a PAS été payé."))return;
 const{error}=await sb.rpc("admin_set_withdrawal",{wid:id,new_status:st,ref:null,err:st==="failed"?"Clôturé manuellement par un administrateur.":null});
 $("msg").className="pfm "+(error?"ko":"ok");$("msg").textContent=error?error.message:"Retrait mis à jour.";load()}
$("flt").onclick=e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.s;document.querySelectorAll("#flt button").forEach(x=>x.className=x===b?"on":"");draw()};
(async()=>{const{data:{session}}=await sb.auth.getSession();if(!session)return location.href="auth.html#login";
 const{data:adm}=await sb.rpc("is_admin");if(!adm)return location.href="dashboard.html";load();setInterval(()=>{if(!document.hidden)load()},30000)})();
</script></body></html>

<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#130F33"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Hanken+Grotesk:wght@400;500;700&display=swap"><link rel="stylesheet" href="style.css"><style>[hidden]{display:none!important}.ab{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ab .btn{width:auto;flex:1;min-width:130px;padding:10px 14px}.cpb{border:1px solid var(--line,#444);background:transparent;color:inherit;border-radius:8px;padding:3px 10px;font:700 12px system-ui,sans-serif;cursor:pointer;margin-left:8px}.topay{font:800 20px/1.2 'Bricolage Grotesque',sans-serif;margin:6px 0 4px}</style><link rel="stylesheet" href="theme.css"><title>Retraits – Administration</title></head><body><div class="wrap">
<header class="top"><a class="logo" href="index.html"><img src="icon.svg" alt="" width="34" height="34"><span>Pronos-bet</span></a></header>
<h1 class="pt">Retraits</h1><p class="sub" style="text-transform:none">Les retraits « à payer » (manuels : Mobile Money, virement, PayPal, USDT) se paient ici, puis se marquent payés ou refusés (le solde est alors recrédité). <a href="admin.html">← Administration</a></p>
<div id="tot" class="kpi" style="margin:6px 0 14px"></div>
<div class="flt" id="flt"><button data-s="open" class="on" type="button">À suivre</button><button data-s="" type="button">Tous</button></div>
<div id="msg" class="pfm" role="status"></div>
<div id="list"><p class="sub">Chargement…</p></div><div style="height:40px"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script src="config.js"></script><script>
const $=i=>document.getElementById(i),sb=supabase.createClient(CFG.url,CFG.key);
</script><script src="menu.js"></script><script>
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=s=>s?new Date(s).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"—";
const ST={pending:["in","En attente"],processing:["in","En cours"],manual:["in","À payer"],paid:["ok","Payé"],failed:["ko","Échoué"],canceled:["mu","Annulé"]};
let filter="open",rows=[];
const MT={mobile_auto:"Mobile Money (automatique)",mobile_manual:"Mobile Money (manuel)",bank:"Virement bancaire",usdt:"USDT TRC20",paypal:"PayPal"};
const kvr=(k,v,c)=>'<div class="kv"><span>'+k+'</span><b>'+esc(v)+(c?'<button class="cpb" data-t="'+esc(v)+'" type="button">Copier</button>':"")+'</b></div>';
function dest(w){const d=w.details||{};
 if(w.method==="bank")return kvr("Banque",d.bank_name||"—")+kvr("Pays",w.country)+kvr("Destinataire",d.holder||"—",1)+kvr("Compte / IBAN",d.account||"—",1)+kvr("SWIFT",d.swift||"—",!!d.swift)+kvr("Adresse",[[d.street_no,d.street].filter(Boolean).join(" "),d.city,d.postal].filter(Boolean).join(", ")||"—");
 if(w.method==="usdt")return kvr("Réseau","TRC20")+kvr("Adresse USDT",d.address||"—",1);
 if(w.method==="paypal")return kvr("E-mail PayPal",d.email||"—",1);
 return kvr("Pays · réseau",w.country+" · "+w.network)+kvr("Numéro",w.phone,1)}
const draw=()=>{const l=filter==="open"?rows.filter(w=>w.status==="pending"||w.status==="processing"||w.status==="manual"):rows;
 $("list").innerHTML=l.length?l.map(w=>{const s=ST[w.status]||["mu",w.status],open=w.status==="pending"||w.status==="processing"||w.status==="manual",fee=Number(w.fee||0),net=Number(w.amount)-fee;
  return '<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>'+Number(w.amount).toLocaleString("fr-FR")+' F</b><span class="bd '+s[0]+'">'+s[1]+'</span></div>'
  +'<div class="kv"><span>Utilisateur</span><b>'+esc(w.full_name||w.email)+'</b></div>'
  +(fee>0?'<div class="topay">À payer : '+net.toLocaleString("fr-FR")+' F</div><p class="note" style="margin:0 0 6px">Montant demandé '+Number(w.amount).toLocaleString("fr-FR")+' F − frais de 10 % ('+fee.toLocaleString("fr-FR")+' F)</p>':"")
  +kvr("Moyen",MT[w.method]||w.method||"—")+dest(w)
  +'<div class="kv"><span>Demandé le</span><b>'+dt(w.created_at)+'</b></div>'
  +(w.provider_ref?'<div class="kv"><span>Réf. paiement</span><b>'+esc(w.provider_ref)+'</b></div>':"")
  +(w.error?'<p class="note">'+esc(w.error)+'</p>':"")
  +(open?'<div class="ab"><button class="btn" data-w="'+w.id+'" data-s="paid" type="button">Marquer payé</button><button class="btn danger" data-w="'+w.id+'" data-s="failed" type="button">Refuser + recréditer</button></div>':"")+'</div>'}).join(""):'<div class="card"><p class="sub" style="margin:0">Aucun retrait.</p></div>';
 document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>act(b.dataset.w,b.dataset.s));
 document.querySelectorAll(".cpb").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.t);b.textContent="Copié ✓"}catch(e){prompt("Copie :",b.dataset.t)}})};
const F=n=>Number(n||0).toLocaleString("fr-FR")+" F";
async function totals(){const{data}=await sb.rpc("admin_wallet_totals");if(!data)return;
 const k=(l,v,s)=>'<div class="kp"><span>'+l+'</span><b style="font-size:22px">'+F(v)+'</b>'+(s?'<small>'+s+'</small>':"")+'</div>';
 $("tot").innerHTML=k("À devoir aux utilisateurs",data.owed,"soldes actuels")+k("Gagné par parrainage",data.earned)+k("Déjà payé",data.paid)+k("Retraits en cours",data.in_progress)+k("Frais perçus",data.fees,"10 % des retraits manuels payés")}
async function load(){totals();const{data,error}=await sb.rpc("admin_withdrawals",{lim:100});
 if(error){if(error.code==="42501")return location.href="dashboard.html";$("list").innerHTML='<div class="card">'+esc(error.message)+'</div>';return}
 rows=data||[];draw()}
async function act(id,st){
 const w=rows.find(x=>x.id===id)||{},manual=w.method&&w.method!=="mobile_auto",net=Number(w.amount||0)-Number(w.fee||0);
 let ref=null,err=null;
 if(st==="paid"){
  if(!confirm(manual?"Confirme que tu as bien envoyé "+net.toLocaleString("fr-FR")+" F (frais déduits) à cette destination ?":"Confirmer que ce retrait a bien été payé à l’utilisateur ?"))return;
  const r=prompt("Référence du paiement (facultatif) :","");if(r===null)return;ref=r.trim()||null}
 else{
  if(!manual&&!confirm("Marquer ce retrait comme échoué et recréditer l’utilisateur ?\nVérifie d’abord dans iKeePay (ou MoneyFusion pour les anciens retraits) qu’il n’a PAS été payé."))return;
  const r=prompt("Motif du refus (visible par l’utilisateur). Le solde sera recrédité :","Retrait refusé : informations de paiement incorrectes.");if(r===null)return;
  err=r.trim()||"Retrait refusé par un administrateur."}
 const{error}=await sb.rpc("admin_set_withdrawal",{wid:id,new_status:st,ref:ref,err:err});
 $("msg").className="pfm "+(error?"ko":"ok");$("msg").textContent=error?error.message:(st==="paid"?"Retrait marqué payé.":"Retrait refusé, solde recrédité.");load()}
$("flt").onclick=e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.s;document.querySelectorAll("#flt button").forEach(x=>x.className=x===b?"on":"");draw()};
(async()=>{const{data:{session}}=await sb.auth.getSession();if(!session)return location.href="auth.html#login";
 const{data:adm}=await sb.rpc("is_admin");if(!adm)return location.href="dashboard.html";load();setInterval(()=>{if(!document.hidden)load()},30000)})();
</script><script src="admin-nav.js"></script></body></html>
